                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/specifications:
        get:
            tags:
                - SpecificationService
            description: Возвращает список спецификаций, доступных для выбранной версии продукта.
            operationId: SpecificationService_List
            parameters:
                - name: version_name
                  in: query
                  description: |-
                    Версия продукта.
                     Укажите для получения спецификаций.
                  schema:
                    type: string
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `postgres`.
                  schema:
                    type: string
                - name: cluster_id
                  in: query
                  description: |-
                    Идентификатор кластера.
                     Укажите для получения спецификаций, доступных для вертикального масштабирования кластера.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListSpecificationResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/versions:
        get:
            tags:
                - VersionService
            description: Возвращает список всех доступных версий продукта.
            operationId: VersionService_List
            parameters:
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `postgres`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListVersionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/versions/{version_name}:locales:
        get:
            tags:
                - VersionService
            description: Возвращает список локалей, доступных для выбранной версии продукта.
            operationId: VersionService_ListLocales
            parameters:
                - name: version_name
                  in: path
                  description: Версия продукта.
                  required: true
                  schema:
                    type: string
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `postgres`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListVersionLocalesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
components:
    schemas:
        cloudru.dbaas.operation.Operation:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор операции.
                resource_name:
                    readOnly: true
                    example: urn:cloud:postgresql::265c6f28-9c84-4cef-bbc5-4472c1743bc0:backend
                    type: string
                    description: Информация о ресурсе, над которым производится операция.
                    format: urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT
                resource_id:
                    readOnly: true
                    example: 54295782-7aef-43e6-b33b-c9735938677a
                    type: string
                    description: Уникальный идентификатор ресурса, над которым производится операция.
                created_at:
                    readOnly: true
                    type: string
                    description: Время создания операции.
                    format: date-time
                updated_at:
                    readOnly: true
                    type: string
                    description: Время последнего изменения операции.
                    format: date-time
                done:
                    readOnly: true
                    type: boolean
                    description: |-
                        Флаг завершенности операции:
                         - `true` — операция завершена. Операция считается завершенной, даже если в ходе ее выполнения возникла ошибка.
                         - `false` — операция не завершена.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
                    description: Результат операции в случае ошибки.
        cloudru.dbaas.postgresql.v1.AnytimeMaintenanceWindow:
            type: object
            properties: {}
            description: Техническое обслуживание в любое время.
        cloudru.dbaas.postgresql.v1.Backup:
            type: object
            properties:
                id:
                    readOnly: true
                    type: string
                    description: Идентификатор резервной копии.
                name:
                    readOnly: true
                    type: string
                    description: Название резервной копии.
                status:
                    readOnly: true
                    enum:
                        - BACKUP_STATUS_UNSPECIFIED
                        - BACKUP_STATUS_PENDING
                        - BACKUP_STATUS_STARTED
                        - BACKUP_STATUS_COMPLETED
                        - BACKUP_STATUS_FAILED
                    type: string
                    description: Статус резервной копии.
                    format: enum
                size_bytes:
                    readOnly: true
                    type: string
                    description: Размер резервной копии в байтах.
                    format: int64
                started_at:
                    readOnly: true
                    type: string
                    description: Время начала создания резервной копии.
                    format: date-time
                finished_at:
                    readOnly: true
                    type: string
                    description: Время окончания создания резервной копии.
                    format: date-time
        cloudru.dbaas.postgresql.v1.BackupSpec:
            type: object
            properties:
                schedule:
                    example: 0 3 * * 0
                    type: string
                    description: |-
                        Расписание автоматического резервного копирования в формате CRON-выражения.
                         Например, выражение '15 14 ? * *' будет запускать задачу каждый день в 14:15.
                         Краткий формат вида "@midnight" или "@every 1h30m" не поддерживается.
                         Автоматическое резервное копирование может происходить не чаще, чем раз в 6 часов.
                         По умолчанию запускается каждое воскресенье в 03:00, резервные копии хранятся в течение 14 дней.
                retention_policy_days:
                    example: 14
                    type: integer
                    description: |-
                        Срок хранения автоматически созданных резервных копий.
                         Максимальное значение — 30 дней.
                    format: int32
            description: Параметры автоматического резервного копирования.
        cloudru.dbaas.postgresql.v1.Cluster:
            required:
                - name
                - project_id
                - version
                - specification_id
                - storage
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: awesome-postgres-cluster
                    type: string
                    description: Название кластера.
                description:
                    example: Production PostgreSQL cluster
                    type: string
                    description: Описание кластера.
                project_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                connection_string:
                    readOnly: true
                    example: postgres://user:pass@host:port/db
                    type: string
                    description: Строка подключения.
                health:
                    readOnly: true
                    example: HEALTHY
                    enum:
                        - HEALTH_UNSPECIFIED
                        - HEALTHY
                        - UNHEALTHY
                    type: string
                    description: Состояние кластера.
                    format: enum
                status:
                    readOnly: true
                    example: READY
                    enum:
                        - STATUS_UNSPECIFIED
                        - PENDING
                        - DEPLOYING
                        - FAILED
                        - UPDATING
                        - READY
                        - SUSPENDED
                        - SUSPENDING
                        - ERASED
                        - ERASING
                        - ROLLING_BACK
                    type: string
                    description: Статус кластера.
                    format: enum
                version:
                    example: 17
                    type: string
                    description: Версия продукта.
                instances:
                    example: 2
                    type: integer
                    description: |-
                        Количество узлов кластера.
                         Допустимые значения зависят от режима развертывания кластера: 1-2 узла для `standard`, 1-3 узла для `business`.

                         Если в `subnet_ids` указано несколько подсетей, кластер считается мультизональным,
                         и количество узлов должно совпадать с количеством подсетей.
                    format: int32
                subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы подсетей. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер считается мультизональным.
                         Мультизональный режим доступен только для кластеров типа `business`.
                         В этом случае количество подсетей должно совпадать с количеством узлов `instances`,
                         а каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор спецификации кластера.
                         Ресурсы кластера типа `standard` нельзя изменить после создания.
                storage:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.StorageSize'
                    description: Размеры дисков кластера.
                pooler_config:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ConnectionPoolerConfig'
                    description: Конфигурация пулера соединений PgBouncer.
                backup:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.BackupSpec'
                    description: Параметры автоматического резервного копирования.
                logging:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.LoggingConfig'
                    description: Параметры интеграции с сервисом Клиентского логирования.
                maintenance_window:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.MaintenanceWindow'
                    description: Окно проведения технического обслуживания.
                created_at:
                    readOnly: true
                    example: 2026-01-01T10:00:00Z
                    type: string
                    description: Время создания кластера.
                    format: date-time
                created_by:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор пользователя, создавшего кластер.
                subnet_id:
                    example: 00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: Устарело. Используйте поле `subnet_ids`.
                sync_replication_enabled:
                    readOnly: true
                    example: false
                    deprecated: true
                    type: boolean
                    description: Не имеет эффекта.
            description: Кластер PostgreSQL.
        cloudru.dbaas.postgresql.v1.ConnectionPoolerConfig:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: |-
                        Включить пулер соединений. По умолчанию `false` — пулер выключен.
                         Нельзя изменить после создания кластера.
                pool_mode:
                    example: TRANSACTION
                    enum:
                        - POOL_MODE_UNSPECIFIED
                        - SESSION
                        - TRANSACTION
                    type: string
                    description: |-
                        Режим работы пулера соединений. По умолчанию `SESSION`.
                         [Подробнее](https://www.pgbouncer.org/config.html#pool_mode).
                    format: enum
                parameters:
                    example: {"max_client_conn": 100}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Дополнительные параметры конфигурации PgBouncer. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Пулер соединений](https://cloud.ru/docs/paas-postgresql/ug/topics/guides__connection-pooler).

                         Параметр `pool_mode` задается отдельно через поле `pool_mode`.
            description: Конфигурация пулера соединений PgBouncer.
        cloudru.dbaas.postgresql.v1.CreateBackupRequest:
            required:
                - cluster_id
                - name
            type: object
            properties:
                cluster_id:
                    type: string
                    description: Идентификатор кластера.
                name:
                    type: string
                    description: |-
                        Название резервной копии.
                         Начинается и заканчивается только латинской буквой или цифрой.
                         Внутри может содержать буквы, цифры, дефисы ('-') и точки, но не может начинаться или заканчиваться дефисом и точкой.
            description: Запрос на создание резервной копии.
        cloudru.dbaas.postgresql.v1.CreateClusterRequest:
            required:
                - name
                - project_id
                - version
                - specification_id
                - storage
                - initial_database
            type: object
            properties:
                name:
                    example: awesome-postgres-cluster
                    type: string
                    description: Название кластера.
                description:
                    example: Production PostgreSQL cluster
                    type: string
                    description: Описание кластера.
                project_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                version:
                    example: 17
                    type: string
                    description: Версия кластера.
                instances:
                    example: 2
                    type: integer
                    description: |-
                        Количество узлов кластера.
                         Допустимые значения зависят от режима развертывания кластера: 1-2 узла для `standard`, 1-3 узла для `business`.

                         Если в `subnet_ids` указано несколько подсетей, кластер считается мультизональным,
                         и количество узлов должно совпадать с количеством подсетей.
                    format: int32
                subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Обязательное поле. Идентификаторы подсетей. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер считается мультизональным.
                         Мультизональный режим доступен только для кластеров типа `business`.
                         В этом случае количество подсетей должно совпадать с количеством узлов `instances`,
                         а каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор спецификации кластера.
                         Ресурсы кластера типа `standard` нельзя изменить после создания.
                storage:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.StorageSize'
                    description: Размеры дисков кластера.
                initial_database:
                    example: myapp_db
                    type: string
                    description: Название базы данных, которая будет создана в экземпляре сервиса по умолчанию.
                initial_database_lc_collate:
                    example: C
                    type: string
                    description: |-
                        Локаль сортировки базы данных, созданной по умолчанию.
                         Нельзя изменить после создания кластера.
                         Значение по умолчанию — `C`.
                initial_database_lc_ctype:
                    example: C
                    type: string
                    description: |-
                        Локаль набора символов базы данных, созданной по умолчанию.
                         Нельзя изменить после создания кластера.
                         Значение по умолчанию — `C`.
                pooler_config:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ConnectionPoolerConfig'
                    description: |-
                        Конфигурация пулера соединений PgBouncer.
                         Пулер соединений нельзя включить или отключить после создания кластера.
                backup:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.BackupSpec'
                    description: Параметры автоматического резервного копирования.
                recovery_spec:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.RecoverySpec'
                    description: Параметры восстановления кластера.
                logging:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.LoggingConfig'
                    description: Параметры интеграции с сервисом Клиентского логирования.
                maintenance_window:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.MaintenanceWindow'
                    description: Окно проведения технического обслуживания.
                subnet_id:
                    example: 00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: Устарело. Используйте поле `subnet_ids`.
                primary_standby_mode:
                    example: true
                    deprecated: true
                    type: boolean
                    description: Устарело. Используйте поле `instances`.
