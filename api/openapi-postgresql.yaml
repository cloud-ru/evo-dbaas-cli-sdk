            tags:
                - OperationService
            description: Получение информации об операции по идентификатору.
            operationId: OperationService_Get
            parameters:
                - name: operation_id
                  in: path
                  description: Идентификатор операции.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
