                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.WeeklyMaintenanceWindow'
                    description: Техническое обслуживание по расписанию.
            description: Настройки окна проведения технического обслуживания.
        cloudru.dbaas.postgresql.v1.PostgreSQLRole:
            type: object
            properties:
                name:
                    readOnly: true
                    example: pg_read_all_data
                    type: string
                    description: Название роли.
        cloudru.dbaas.postgresql.v1.RecoverySpec:
            required:
                - cluster_id
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: ClusterID - идентификатор кластера, которому требуется восстановление.
                pitr:
                    example: 2026-01-01T12:00:00Z
                    type: string
                    description: |-
                        PITR — восстановление на момент времени (point-in-time-recovery).
                         Введите время восстановления в формате временной метки.
                    format: date-time
                backup_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: BackupID — идентификатор резервной копии, из которой необходимо восстановить кластер.
            description: |-
                RecoverySpec — параметры восстановления кластера.
                 Кластер можно восстановить на момент времени (PITR) или из резервной копии по ее идентификатору (BackupID).
                 В обоих случаях восстановление происходит в новый кластер.
        cloudru.dbaas.postgresql.v1.Specification:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации.
                display_name:
                    readOnly: true
                    example: my-specification
                    type: string
                    description: Название спецификации.
                cpu:
                    readOnly: true
                    example: 4
                    type: number
                    description: Количество виртуальных ядер процессора.
                    format: double
                memory:
                    readOnly: true
                    example: 32
                    type: number
                    description: Объем оперативной памяти в гигабайтах.
                    format: double
                allow_primary_standby:
                    readOnly: true
                    example: true
                    type: boolean
                    description: |-
                        Отказоустойчивость кластера. Возможные значения:
                         - `true` — отказоустойчивая конфигурацию с двумя синхронизированными узлами: основным и резервным.
                         - `false` — одноузловая конфигурация.
                max_hosts:
                    readOnly: true
                    example: 3
                    type: integer
                    description: Максимальное количество узлов, которое поддерживает текущая спецификация.
                    format: int32
                deployment_mode:
                    readOnly: true
                    example: BUSINESS
                    enum:
                        - DEPLOYMENT_MODE_UNSPECIFIED
                        - STANDARD
                        - BUSINESS
                    type: string
                    description: |-
                        Режим развертывания кластера. Возможные значения:
                         - `standard` — для тестирования и небольших приложений.
                         - `business` — для высоконагруженных сервисов.
                    format: enum
                flavor_type:
                    readOnly: true
                    example: MEMORY
                    enum:
                        - FLAVOR_TYPE_UNSPECIFIED
                        - MEMORY
                        - CPU
                        - BALANCE
                    type: string
                    description: |-
                        Категория флейвора. Возможные значения:
                         - `cpu` — содержит флейворы с увеличенной долей ядер процессора. Соотношение vCPU к RAM 1:1 и 1:2.
                         - `balance` — содержит флейворы с оптимальным соотношением vCPU к RAM 1:4.
                         - `memory` — содержит флейворы с увеличенной долей оперативной памяти. Соотношение vCPU к RAM 1:8 и 1:16.
                    format: enum
                min_storage_gb:
                    readOnly: true
                    example: 50
                    type: integer
                    description: Минимальный размер диска в гигабайтах.
                    format: int32
            description: Характеристики спецификации.
        cloudru.dbaas.postgresql.v1.StorageInfoResponse:
            type: object
            properties:
                read_only_mode:
                    readOnly: true
                    example: false
                    type: boolean
                    description: |-
                        Доступ к кластеру:
                         — `true` — кластер находится в режиме только для чтения;
                         — `false` — кластер доступен для записи и чтения.
                pg_data:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.StorageUsage'
                    description: Текущее использование основного диска с данными.
                pg_wal:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.StorageUsage'
                    description: |-
                        Текущее использование диска с WAL-журналом предзаписи.
                         Значение является опциональным, отображается при размещении WAL-журнала на отдельном диске.
        cloudru.dbaas.postgresql.v1.StorageSize:
            required:
                - pg_data_gb
            type: object
            properties:
                pg_data_gb:
                    example: 100
                    type: integer
                    description: Размер основного диска с данными в гигабайтах.
                    format: int32
                pg_wal_gb:
                    example: 40
                    type: integer
                    description: |-
                        Размер диска с WAL-журналом предзаписи в гигабайтах.
                         При указании WAL-журнал будет размещен на отдельном диске.
                         Размер должен составлять не менее 20% от основного диска.
                         Значение является опциональным.
                    format: int32
            description: Размеры дисков кластера — основного с данными и дополнительного WAL-диска.
        cloudru.dbaas.postgresql.v1.StorageUsage:
            type: object
            properties:
                used_gb:
                    readOnly: true
                    example: 50
                    type: number
                    description: Объем занимаемого дискового пространства.
                    format: double
                total_gb:
                    readOnly: true
                    example: 100
                    type: number
                    description: Общий объем доступного дискового пространства.
                    format: double
            description: Подробная информация об используемом дисковом пространстве.
        cloudru.dbaas.postgresql.v1.UpdateClusterRequest:
            required:
                - cluster_id
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                instances:
                    example: 2
                    type: integer
                    description: |-
                        Количество узлов кластера.
                         Допустимые значения зависят от режима развертывания кластера: 1-2 узла для `standard`, 1-3 узла для `business`.

                         Если в `subnet_ids` указано несколько подсетей, кластер считается мультизональным,
                         и количество узлов должно совпадать с количеством подсетей.
                    format: int32
                subnet_ids:
                    example: {"value": ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]}
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Идентификаторы подсетей. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер считается мультизональным.
                         Мультизональный режим доступен только для кластеров типа `business`.
                         В этом случае количество подсетей должно совпадать с количеством узлов `instances`,
                         а каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор спецификации кластера.
                         Ресурсы кластера типа `standard` нельзя изменить после создания.
                storage:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.StorageSize'
                    description: Размеры дисков кластера.
                pooler_config:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ConnectionPoolerConfig'
                    description: |-
                        Конфигурация пулера соединений PgBouncer.
                         Пулер соединений нельзя включить или отключить после создания кластера.
                backup:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.BackupSpec'
                    description: |-
                        Параметры автоматического резервного копирования.
                         Резервное копирование нельзя включить или отключить после создания кластера.
                maintenance_window:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.MaintenanceWindow'
                    description: Окно проведения технического обслуживания.
            description: Запрос на изменение кластера.
        cloudru.dbaas.postgresql.v1.UpdateUserRequest:
            required:
                - cluster_id
                - name
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера для обновления.
                name:
                    example: username
                    type: string
                    description: Имя пользователя. Используется только для идентификации существующего пользователя.
                granted_roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.PostgreSQLRole'
                    description: Назначаемые роли.
                password:
                    example: NewSecurePass456!
                    type: string
                    description: Пароль.
            description: |-
                Запрос на изменение пользователя в кластере.
                 Позволяет назначать роли и менять пароль пользователя. Переименование пользователя не поддерживается.
        cloudru.dbaas.postgresql.v1.User:
            required:
                - name
            type: object
            properties:
                name:
                    example: username
                    type: string
                    description: Имя пользователя.
                supported_roles:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.PostgreSQLRole'
                    description: Доступные роли.
                granted_roles:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.PostgreSQLRole'
                    description: Назначенные роли.
        cloudru.dbaas.postgresql.v1.Version:
            type: object
            properties:
                name:
                    readOnly: true
                    example: 17
                    type: string
                    description: Название версии продукта.
            description: Версия продукта.
        cloudru.dbaas.postgresql.v1.WeeklyMaintenanceWindow:
            required:
                - day
                - hour
            type: object
            properties:
                day:
                    example: SAT
                    enum:
                        - WEEK_DAY_UNSPECIFIED
                        - WEEK_DAY_MON
                        - WEEK_DAY_TUE
                        - WEEK_DAY_WED
                        - WEEK_DAY_THU
                        - WEEK_DAY_FRI
                        - WEEK_DAY_SAT
                        - WEEK_DAY_SUN
                    type: string
                    description: День недели проведения технического обслуживания.
                    format: enum
                hour:
                    example: 2
                    type: integer
                    description: Час начала окна по UTC в диапазоне 1-24 (00:00-23:00).
                    format: int32
            description: Техническое обслуживание по расписанию.
        cloudru.protobuf.v1.RepeatedString:
            type: object
            properties:
                value:
                    type: array
                    items:
                        type: string
                    description: The repeated string value.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: URL-адрес или имя ресурса, которое определяет тип сериализованного сообщения.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: Код ошибки.
                    format: int32
                message:
                    type: string
                    description: Описание ошибки.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: Дополнительная информация об ошибке.
            description: Ошибка.
tags:
    - name: BackupService
      description: Управление резервными копиями кластеров PostgreSQL.
    - name: ClusterService
      description: Управление кластерами PostgreSQL.
    - name: DatabaseService
      description: Управление базами данных PostgreSQL.
    - name: OperationService
      description: Управление операциями PostgreSQL.
    - name: SpecificationService
      description: Управление спецификациями PostgreSQL.
    - name: UserService
      description: Управление пользователями PostgreSQL.
    - name: VersionService
      description: Управление версиями PostgreSQL.
