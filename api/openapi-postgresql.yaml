            description: Создание базы данных.
            operationId: DatabaseService_Create
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.CreateDatabaseRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.Database'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/databases/{name}:
        get:
            tags:
                - DatabaseService
            description: Получение базы данных в кластере.
            operationId: DatabaseService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Название базы данных.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.Database'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - DatabaseService
            description: Удаление базы данных в кластере.
            operationId: DatabaseService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Название базы данных.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.DeleteDatabaseResponse'
                default:
