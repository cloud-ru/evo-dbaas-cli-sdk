openapi: 3.0.3
info:
    title: Cloud.ru Managed PostgreSQL API
    description: '[Документация Managed PostgreSQL](https://cloud.ru/docs/paas-postgresql/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: 1.0.0
servers:
    - url: https://postgresql.api.cloud.ru
paths:
    /v1/clusters:
        get:
            tags:
                - ClusterService
            description: Получение списка кластеров PostgreSQL, созданных в указанном проекте.
            operationId: ClusterService_List
            parameters:
                - name: project_id
                  in: query
                  description: |-
                    Идентификатор проекта.
                     Обязательное поле.
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: |-
                    Максимальное количество результатов на странице ответа.
                     Значение по умолчанию — 100. Максимальное значение — 1000.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `postgres`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListClustersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - ClusterService
            description: Создание кластера.
            operationId: ClusterService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}:
        get:
            tags:
                - ClusterService
            description: Получение информации о кластере.
            operationId: ClusterService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.Cluster'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - ClusterService
            description: Удаление кластера.
            operationId: ClusterService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        patch:
            tags:
                - ClusterService
            description: Изменение кластера.
            operationId: ClusterService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.UpdateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/backups:
        get:
            tags:
                - BackupService
            description: Список резервных копий.
            operationId: BackupService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListBackupsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - BackupService
            description: Создание резервной копии.
            operationId: BackupService_Create
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.CreateBackupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/backups/{name}:
        get:
            tags:
                - BackupService
            description: Получение резервной копии кластера.
            operationId: BackupService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Название резервной копии.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.Backup'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/databases:
        get:
            tags:
                - DatabaseService
            description: Список баз данных.
            operationId: DatabaseService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListDatabasesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
