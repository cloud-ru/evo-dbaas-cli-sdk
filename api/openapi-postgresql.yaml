            description: Получение возможных локалей для кластера.
            operationId: ClusterService_ListLocales
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.ListLocalesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}:resume:
        post:
            tags:
                - ClusterService
            description: Запуск приостановленного кластера.
            operationId: ClusterService_Resume
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
