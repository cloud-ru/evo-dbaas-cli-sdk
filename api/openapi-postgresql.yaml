            tags:
                - ClusterService
            description: Получение информации о хранилище.
            operationId: ClusterService_StorageInfo
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.StorageInfoResponse'
                default:
