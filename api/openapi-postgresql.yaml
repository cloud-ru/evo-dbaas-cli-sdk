                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/users/{name}:
        get:
            tags:
                - UserService
            description: Получение пользователя в кластере.
            operationId: UserService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        put:
            tags:
                - UserService
            description: Изменение пользователя кластера.
            operationId: UserService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера для обновления.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя. Используется только для идентификации существующего пользователя.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.UpdateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.postgresql.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - UserService
            description: Удаление пользователя в кластере.
            operationId: UserService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
