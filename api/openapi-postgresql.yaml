    /v1/clusters/{cluster_id}:suspend:
        post:
            tags:
                - ClusterService
            description: Приостановка кластера.
            operationId: ClusterService_Suspend
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
