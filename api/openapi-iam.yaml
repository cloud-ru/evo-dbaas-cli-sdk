            Обязательно должно быть указано одно из полей: role_name или role_id.
            НЕЛЬЗЯ указывать несколько полей одновременно.
        properties:
            roleId:
                description: |-
                    RoleID — идентификатор роли для назначения (UUID).
                    Может использоваться для любой роли (продуктовой или пользовательской).
                type: string
            roleName:
                description: |-
                    RoleName — название роли для назначения.
                    Может использоваться для продуктовых ролей.
                    В случае коллизии продуктовой и пользовательской роли по имени
                    вернется ошибка, передавайте идентификатор роли (role_id).
                type: string
        type: object
info:
  title: Администрирование сервисных аккаунтов, пользователей и групп пользователей
  description: '[Документация Настройки и администрирование](https://cloud.ru/docs/administration/ug/index.html)'
  contact:
    email: support@cloud.ru
  version: '1.0'
servers:
  - url: https://iam.api.cloud.ru     
openapi: 3.0.0
paths:
    /api/v1/actions:
        get:
            operationId: ActionService_List
            parameters:
                - description: |-
                    Filter — выражение для фильтрации.
                    name=name (поддерживается частичное совпадение: name=*name*) — необязательный фильтр
                    description=description (поддерживается частичное совпадение: description=*description*) — необязательный фильтр
                    product_code=code — необязательный фильтр

                    Объединение фильтров: поддерживается только оператор AND
                    name=name AND product_code=code
                  in: query
                  name: filter
                  required: false
                  type: string
                - description: PageSize — количество элементов на странице.
                  format: uint64
                  in: query
                  name: pageSize
                  required: false
                  type: string
                - description: PageToken — токен страницы, возвращнный ранее в ListActionsResponse.next_page_token.
                  in: query
                  name: pageToken
                  required: false
                  type: string
                - description: |-
                    OrderBy — название поля, по которому выполняется сортировка. Пример: поле + направление — "name desc"
                    Поддерживаемые поля: name
                  in: query
                  name: orderBy
                  required: false
                  type: string
            responses:
                "200":
                    content:
