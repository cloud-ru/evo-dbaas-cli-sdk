consumes:
    - application/json
definitions:
    CustomersServiceInviteUserBody:
        properties:
            accountType:
                $ref: '#/definitions/v1customersUserAccountType'
                title: 'AccountType — тип учетной записи пользователя: федеративный или локальный'
            email:
                title: Email — email пользователя
                type: string
            federative:
                title: |-
                    Federative — флаг, определяющий, является ли пользователь федеративным или локальным
                    Deprecated: используйте поле AccountType
                type: boolean
            firstName:
                title: FirstName — имя пользователя
                type: string
            idpId:
                title: |-
                    IDPID — необязательное поле для связи пользователя с idp организации
                    Поддерживается только для федеративных пользователей
                type: string
            lastName:
                title: LastName — фамилия пользователя
                type: string
            middleName:
                title: MiddleName — отчество пользователя
                type: string
            userName:
                title: UserName — имя пользователя
                type: string
        title: InviteUserRequest — запрос на приглашение пользователя в организацию
        type: object
    CustomersServiceReInviteUserBody:
        properties:
            userId:
                title: UserID — идентификатор пользователя
                type: string
        title: ReInviteUserRequest — запрос на повторное приглашение пользователя
        type: object
    CustomersServiceUpdateUserBody:
        properties:
            enabled:
                title: Enabled — флаг блокировки/разблокировки пользователя
                type: boolean
            firstName:
                title: FirstName — имя пользователя
                type: string
            lastName:
                title: LastName — фамилия пользователя
                type: string
            middleName:
                title: MiddleName — отчество пользователя
                type: string
        title: UpdateUserRequest — запрос на обновление пользователя
        type: object
    RoleServiceGetSpecBody:
        description: GetSpecRequest — запрос на получение спецификации роли.
        properties:
            version:
                $ref: '#/definitions/permissionRoleAPIVersion'
        type: object
    customersFindUserResponse:
        properties:
            user:
                $ref: '#/definitions/v1customersUser'
                title: User — данные пользователя
        title: FindUserResponse — ответ на поиск пользователя
        type: object
    customersGetUserResponse:
        properties:
            user:
                $ref: '#/definitions/v1customersUser'
                title: User — данные пользователя
        title: GetUserResponse — ответ с данными пользователя организации
        type: object
    customersInviteUserResponse:
        properties:
            userId:
                title: UserID — идентификатор созданного пользователя
                type: string
        title: InviteUserResponse — ответ на приглашение пользователя в организацию
        type: object
    customersUpdateUserResponse:
        properties:
            user:
                $ref: '#/definitions/v1customersUser'
                title: User — обновленный пользователь
        title: UpdateUserResponse — ответ на обновление пользователя
        type: object
    groupsGroupsServiceUpdateBody:
        properties:
            description:
                title: Description — описание группы
                type: string
            name:
                title: Name — название группы
                type: string
        title: UpdateGroupRequest — запрос на обновление группы
        type: object
    groupsUpdateGroupResponse:
        properties:
            group:
                $ref: '#/definitions/v1groupsGroup'
                title: Group — обновленная сущность группы
        title: UpdateGroupResponse — ответ на запрос обновления группы
        type: object
    iamapiv1permissionAction:
        description: Action — данные действия.
        properties:
            createdAt:
                description: CreatedAt — время создания действия.
                format: date-time
                type: string
            description:
                description: Description — описание действия.
                type: string
            groups:
                description: Groups — группы действий.
                items:
                    type: string
                type: array
            name:
                description: Name — название действия.
                type: string
            productCode:
                description: ProductCode — код продукта.
                type: string
            updatedAt:
                description: UpdatedAt — время обновления действия.
                format: date-time
                type: string
        type: object
    iamapiv1permissionProduct:
        description: Product — данные продукта.
        properties:
            code:
                description: Code — код продукта.
                type: string
            name:
                description: Name — название продукта.
                type: string
        type: object
    iamapiv1permissionRole:
        description: Role — данные роли.
        properties:
            actions:
                description: Actions — список действий, связанных с ролью.
                items:
                    type: string
                type: array
            createdAt:
                description: CreatedAt — время создания роли.
                format: date-time
                type: string
            customerId:
                description: CustomerId — идентификатор организации, которой принадлежит эта роль.
                type: string
            description:
                title: |-
                    Description — описание роли.
                    - может содержать буквы unicode в разных регистрах
                    - может содержать цифры
                    - может содержать знаки пунктуации unicode и пробелы
                type: string
            displayName:
                title: |-
                    DisplayName — отображаемое название роли.
                    - может содержать буквы unicode в разных регистрах
                    - может содержать цифры
                    - может содержать знаки пунктуации unicode и пробелы
                    - не может быть длиннее 100 символов
                type: string
            enabled:
                description: Enabled — активность роли.
                type: boolean
            id:
                description: ID — идентификатор роли.
                type: string
            name:
                description: Name — название роли.
                type: string
            type:
                $ref: '#/definitions/iamapiv1permissionRoleType'
                description: Type — тип роли.
            updatedAt:
                description: UpdatedAt — время обновления роли.
                format: date-time
                type: string
        type: object
    iamapiv1permissionRoleType:
        default: ROLE_TYPE_PRODUCT
        description: |-
            RoleType — тип роли.

             - ROLE_TYPE_PRODUCT: ROLE_TYPE_PRODUCT — продуктовая роль.
             - ROLE_TYPE_CUSTOM: ROLE_TYPE_CUSTOM — пользовательская роль.
        enum:
            - ROLE_TYPE_PRODUCT
            - ROLE_TYPE_CUSTOM
        type: string
    iamv1CreateUserRequest:
        properties:
            accountType:
                $ref: '#/definitions/iamv1UserAccountType'
                title: 'AccountType — тип учетной записи пользователя: федеративный или локальный'
            customerId:
                title: CustomerId — идентификатор организации, в которую приглашается пользователь
                type: string
            email:
                title: Email — email пользователя
                type: string
            enabled:
                title: Enabled — флаг блокировки или разблокировки пользователя
                type: boolean
            firstName:
                title: FirstName — имя пользователя
                type: string
            idpId:
                title: |-
                    IDPID — необязательное поле для связи пользователя с idp организации
                    Поддерживается только для федеративных пользователей
                type: string
            lastName:
                title: LastName — фамилия пользователя
                type: string
            middleName:
                title: MiddleName — отчество пользователя
                type: string
        required:
            - customerId
            - email
            - accountType
        title: CreateUserRequest — запрос на создание пользователя
        type: object
    iamv1DeleteUserResponse:
        title: DeleteUserResponse — ответ на удаление пользователя
        type: object
    iamv1Group:
        properties:
            createdAt:
                format: date-time
                readOnly: true
                title: CreatedAt — время создания группы
                type: string
            description:
                readOnly: true
                title: Description — описание группы
                type: string
            id:
                readOnly: true
                title: ID — идентификатор группы
                type: string
            ldapAttributes:
                $ref: '#/definitions/iamv1GroupLDAPAttributes'
                readOnly: true
                title: LDAPAttributes — LDAP-атрибуты группы
            name:
                readOnly: true
                title: Name — название группы
                type: string
            target:
                $ref: '#/definitions/v1GroupTarget'
                readOnly: true
                title: Target — сущность, к которой привязана группа
            updatedAt:
                format: date-time
                readOnly: true
                title: UpdatedAt — время последнего обновления группы
                type: string
        title: Group — сущность группы
        type: object
    iamv1GroupLDAPAttributes:
        properties:
            distinguishedName:
                title: DistinguishedName — уникальное имя группы в LDAP
                type: string
            providerId:
                title: ProviderID — идентификатор LDAP-провайдера
                type: string
        title: GroupLDAPAttributes — LDAP-атрибуты группы
        type: object
    iamv1ListUsersResponse:
        properties:
            nextPageToken:
                title: NextPageToken — токен страницы для получения результатов следующей страницы
                type: string
            users:
                items:
                    $ref: '#/definitions/iamv1User'
                    type: object
                title: Users — список пользователей организации
                type: array
        title: ListUsersResponse — ответ на получение списка пользователей организации
        type: object
    iamv1User:
        properties:
            accountType:
                $ref: '#/definitions/iamv1UserAccountType'
                title: |-
                    AccountType — тип учетной записи пользователя
                    Может быть федеративным или локальным
            createdAt:
                format: date-time
                readOnly: true
                title: CreatedAt — время создания пользователя
                type: string
            email:
                title: Email — электронная почта пользователя
                type: string
            enabled:
                title: Enabled — флаг, указывающий заблокирован ли пользователь
                type: boolean
            firstName:
                title: FirstName — имя пользователя
                type: string
            id:
                title: ID — идентификатор пользователя
                type: string
            lastName:
                title: LastName — фамилия пользователя
                type: string
            middleName:
                title: MiddleName — отчество пользователя
                type: string
            updatedAt:
                format: date-time
                readOnly: true
                title: UpdatedAt — время последнего обновления пользователя
                type: string
        required:
            - email
            - accountType
        title: User — данные пользователя
        type: object
    iamv1UserAccountType:
        default: USER_ACCOUNT_TYPE_UNDEFINED
        description: |-
            - USER_ACCOUNT_TYPE_UNDEFINED: USER_ACCOUNT_TYPE_UNDEFINED — неизвестное значение
             - USER_ACCOUNT_TYPE_FEDERATED: USER_ACCOUNT_TYPE_FEDERATED — тип учетной записи для пользователей с аутентификацией через провайдер идентификации
             - USER_ACCOUNT_TYPE_LOCAL: USER_ACCOUNT_TYPE_LOCAL — тип учетной записи для локальных пользователей
        enum:
            - USER_ACCOUNT_TYPE_UNDEFINED
            - USER_ACCOUNT_TYPE_FEDERATED
            - USER_ACCOUNT_TYPE_LOCAL
        title: UserAccountType — тип учетной записи пользователя
        type: string
    iamv1UserServiceUpdateBody:
        properties:
            enabled:
                title: Enabled — флаг блокировки/разблокировки пользователя
                type: boolean
            firstName:
                title: FirstName — имя пользователя
                type: string
            lastName:
                title: LastName — фамилия пользователя
                type: string
            middleName:
                title: MiddleName — отчество пользователя
                type: string
        required:
            - firstName
            - lastName
            - middleName
            - enabled
        title: UpdateUserRequest — запрос на обновление пользователя
        type: object
    iamv2APIKey:
        properties:
            createdAt:
                format: date-time
                readOnly: true
                title: CreatedAt — дата создания API-ключа
                type: string
            description:
                title: Description — описание API-ключа
                type: string
            enabled:
                title: Enabled — флаг активности API-ключа
                type: boolean
            expiresAt:
                format: date-time
                title: ExpiresAt — дата истечения срока действия API-ключа
                type: string
            id:
                title: ID — идентификатор API-ключа
                type: string
            name:
                title: Name — название API-ключа
                type: string
            productCodes:
                items:
                    type: string
                title: ProductCodes — список кодов продуктов, с которыми может работать API-ключ
                type: array
            restrictions:
                $ref: '#/definitions/iamv2Restrictions'
                title: Restrictions — ограничения API-ключа
            secret:
                readOnly: true
                title: |-
                    Secret — секрет API-ключа.
                    Заполняется только в ответе на запрос создания и пуст в остальных ответах
                type: string
            serviceAccountId:
                title: ServiceAccountID — идентификатор сервисного аккаунта
                type: string
            updatedAt:
                format: date-time
                readOnly: true
                title: UpdatedAt — дата обновления API-ключа
                type: string
        required:
            - name
            - serviceAccountId
            - productCodes
            - enabled
        title: APIKey — API-ключ сервисного аккаунта
        type: object
    iamv2APIKeyServiceUpdateBody:
        properties:
            description:
                title: Description — описание API-ключа
                type: string
            enabled:
                title: Enabled — флаг активности API-ключа
                type: boolean
            name:
                title: Name — название API-ключа
                type: string
            productCodes:
                items:
                    type: string
                title: |-
                    ProductCodes — список кодов продуктов, с которыми может работать API-ключ
                    См. APIKeyProductService/List для возможных значений
                type: array
            restrictions:
                $ref: '#/definitions/iamv2Restrictions'
                title: Restrictions — ограничения API-ключа
        required:
            - name
            - productCodes
            - restrictions
            - enabled
        title: UpdateAPIKeyRequest — запрос на обновление API-ключа
        type: object
    iamv2AccessKey:
        properties:
            createdAt:
                format: date-time
                readOnly: true
                title: CreatedAt — дата создания ключа доступа
                type: string
            description:
                title: Description — описание ключа доступа
                type: string
            expiredAt:
                description: ExpiredAt — дата истечения срока действия ключа доступа.
                format: date-time
                readOnly: true
                type: string
            id:
                title: ID — идентификатор ключа доступа
                type: string
            keyId:
                readOnly: true
                title: KeyID — логин для получения токена доступа
                type: string
            secret:
                readOnly: true
                title: |-
                    Secret — секрет ключа доступа.
                    Заполняется только в ответе на создание и пуст в остальных ответах
                type: string
            serviceAccountId:
                title: ServiceAccountID — идентификатор связанного сервисного аккаунта
                type: string
            updatedAt:
                format: date-time
                readOnly: true
                title: UpdatedAt — дата обновления ключа доступа
                type: string
        required:
            - serviceAccountId
        title: AccessKey — сущность ключа доступа
        type: object
    iamv2CreateUserRequest:
        description: CreateUserRequest — запрос на создание пользователя.
        properties:
            accountType:
                $ref: '#/definitions/iamv2UserAccountType'
                description: AccountType — тип учетной записи пользователя.
            customerId:
                description: |-
                    CustomerID — идентификатор организации,
                    в которую будет добавлен пользователь.
                type: string
            email:
                description: Email — электронная почта пользователя.
                type: string
            enabled:
                description: |-
                    Enabled — флаг активности пользователя.
                    Отключение (false) поддерживается только для
                    федеративных пользователей: создание локального
                    пользователя с enabled=false вернет ошибку.
                type: boolean
            firstName:
                description: FirstName — имя пользователя.
                type: string
            idpId:
                description: |-
                    IDPID — идентификатор провайдера идентификации.
                    Поддерживается только для федеративных
                    пользователей.
                type: string
            lastName:
                description: LastName — фамилия пользователя.
                type: string
            middleName:
                description: MiddleName — отчество пользователя.
                type: string
        required:
            - customerId
            - email
            - accountType
        type: object
    iamv2DeleteUserResponse:
        description: DeleteUserResponse — ответ на удаление пользователя.
        type: object
    iamv2GetTokenRequest:
        description: GetTokenRequest — запрос учетных данных для получения токена.
        properties:
            keyId:
                title: KeyID — идентификатор ключа доступа
                type: string
            secret:
                title: Secret — секрет ключа доступа
                type: string
            serviceAccountId:
                description: |-
                    ServiceAccountID — идентификатор сервисного аккаунта, чей токен нужно выпустить.
                    Если поле не передано, выпускается токен владельца ключа доступа.
                type: string
        required:
            - keyId
            - secret
        type: object
    iamv2GetTokenResponse:
        description: GetTokenResponse — ответ на запрос GetToken.
        properties:
            accessToken:
                description: AccessToken — токен, используемый для доступа к ресурсам.
                type: string
            expiresIn:
                description: ExpiresIn — время в секундах, через которое истечет срок действия AccessToken.
                format: int32
                type: integer
            idToken:
                description: IDToken — токен, используемый для идентификации пользователя.
                type: string
            notBefore:
                description: NotBefore — время в секундах, когда токен может быть использован.
                format: int32
                type: integer
            refreshExpiresIn:
                description: RefreshExpiresIn — время в секундах, через которое истечет срок действия RefreshToken.
                format: int32
                type: integer
            refreshToken:
                description: RefreshToken — токен, используемый для обновления AccessToken.
                type: string
            scopes:
                description: Scopes — список областей действия, к которым имеет доступ токен.
                items:
                    type: string
                type: array
            tokenType:
                description: |-
                    TokenType — тип токена.
                    Будет "Bearer".
                type: string
        type: object
    iamv2Group:
        properties:
            createdAt:
                format: date-time
                title: CreatedAt — время создания группы
                type: string
            description:
                title: Description — описание группы
                type: string
            id:
                title: ID — идентификатор группы
                type: string
            ldapAttributes:
                $ref: '#/definitions/iamv2GroupLDAPAttributes'
                title: LDAPAttributes — LDAP-атрибуты группы
            name:
                title: Name — название группы
                type: string
            target:
                $ref: '#/definitions/iamv2Target'
                title: Target — сущность, с которой связывается группа
            updatedAt:
                format: date-time
                title: UpdatedAt — время обновления группы
                type: string
        title: Group — сущность группы
        type: object
    iamv2GroupLDAPAttributes:
        properties:
            distinguishedName:
                title: DistinguishedName — LDAP distinguished name (DN) группы
                type: string
            providerId:
                description: ProviderID — идентификатор LDAP-провайдера.
                type: string
        title: GroupLDAPAttributes — LDAP-атрибуты группы
        type: object
    iamv2HasUserResponse:
        properties:
            isMember:
                title: IsMember — является ли пользователь участником группы
                type: boolean
        title: HasUserResponse — ответ на запрос проверки членства пользователя
        type: object
    iamv2ImpersonateRequest:
        description: ImpersonateRequest — запрос на выпуск токена сервисного аккаунта без его ключей доступа.
        properties:
            serviceAccountId:
                description: ServiceAccountID — идентификатор сервисного аккаунта, чей токен нужно выпустить.
                type: string
        required:
            - serviceAccountId
        type: object
    iamv2ListAPIKeysResponse:
        description: ListAPIKeysResponse — список API-ключей сервисного аккаунта.
        properties:
            keys:
                items:
                    $ref: '#/definitions/iamv2APIKey'
                    type: object
                title: Keys — список API-ключей
                type: array
            nextPageToken:
                title: NextPageToken — токен страницы для получения следующей страницы
                type: string
        type: object
    iamv2ListGroupsResponse:
        properties:
            groups:
                items:
                    $ref: '#/definitions/iamv2Group'
                    type: object
                title: Groups — список найденных групп
                type: array
            nextPageToken:
                title: NextPageToken — токен страницы для получения результата следующей страницы
                type: string
        title: ListGroupsResponse — ответ на получение списка групп
        type: object
    iamv2ListUsersResponse:
        description: ListUsersResponse — ответ со списком пользователей.
        properties:
            nextPageToken:
                description: NextPageToken — токен следующей страницы.
                type: string
            users:
                description: Users — список пользователей.
                items:
                    $ref: '#/definitions/iamv2User'
                    type: object
                type: array
        type: object
    iamv2Restrictions:
        properties:
            ipAddresses:
                items:
                    type: string
                title: |-
                    IPAddresses — список разрешенных IP-адресов в формате CIDR
                    Можно указать до 100 адресов и подсетей
                type: array
            timeRange:
                $ref: '#/definitions/iamv2TimeRange'
                title: |-
                    TimeRange — временной диапазон, в течение которого может использоваться API-ключ
                    Можно указать до 24 интервалов
        title: Restrictions — ограничения API-ключа
        type: object
    iamv2ServiceAccount:
        properties:
            createdAt:
                format: date-time
                readOnly: true
                title: CreatedAt — дата создания сервисного аккаунта
                type: string
            description:
                title: Description — описание сервисного аккаунта
                type: string
            email:
                description: |-
                    Email — email сервисного аккаунта.
                    Только для чтения, виртуальный.
                readOnly: true
                type: string
            enabled:
                title: Enabled — флаг, определяющий активность сервисного аккаунта
                type: boolean
            id:
                title: ID — идентификатор сервисного аккаунта
                type: string
            name:
