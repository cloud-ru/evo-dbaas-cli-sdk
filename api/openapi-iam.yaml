                    Необязательное. Поддерживается только если запрос выполнен от имени сервисного аккаунта
                  in: query
                  name: userId
                  required: false
                  type: string
                - description: |-
                    ServiceAccountID — идентификатор субъекта сервисного аккаунта, для которого должна быть выполнена проверка
                    Необязательное. Поддерживается, только если запрос выполняется от имени сервисного аккаунта
                  in: query
                  name: serviceAccountId
                  required: false
                  type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/definitions/permissionsEvaluateResponse'
                    description: Успешное выполнение запроса.
                "400":
                    content:
                        application/json:
                            schema: {}
                    description: Некорректный запрос.
                "401":
                    content:
                        application/json:
                            schema: {}
                    description: Необходима авторизация.
                "403":
                    content:
                        application/json:
                            schema: {}
                    description: Доступ запрещен.
                "500":
                    content:
                        application/json:
                            schema: {}
                    description: Внутренняя ошибка сервера.
            summary: |-
                Evaluate — проверка наличия у субъекта разрешений на выполнение действия над объектом.
                Запрос может быть выполнен от имени пользователя или сервисного аккаунта.
                Для запросов от пользователя субъект берется из токена доступа (пользователь может выполнять проверку только для себя)
                Возвращает код состояния 403, если субъекту не разрешено выполнять действие над объектом
                или субъекту из токена не разрешено выполнять проверку для переданных данных запроса
            tags:
                - PermissionsService
