      operationId: get_availability_zone_settings_svc_v1_availability_zones_settings_get
      parameters:
        - required: true
          schema:
            type: string
            format: uuid4
          name: project_id
          description: "Идентификатор проекта. [Узнать идентификатор проекта](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref__project-id?source-platform=Evolution) вы можете в личном кабинете или через API-запрос."
          in: query
        - required: false
          schema:
            type: string
            format: uuid4
          name: availability_zone_id
          description: Идентификатор зоны доступности.
          in: query
      responses:
        '200':
          description: Запрос выполнен успешно
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicAvailabilityZoneSettingsResponse'
                type: array
                title: Response Get Availability Zone Settings Svc V1 Availability Zones Settings Get
        '401':
          description: Ошибка аутентификации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthUnauthorizedExceptionSchema'
                type: array
                title: Response 401 Get Availability Zone Settings Svc V1 Availability Zones Settings Get
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthForbiddenExceptionSchema'
                type: array
                title: Response 403 Get Availability Zone Settings Svc V1 Availability Zones Settings Get
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomRequestValidationErrorSchema'
                type: array
                title: Response 422 Get Availability Zone Settings Svc V1 Availability Zones Settings Get
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIExceptionSchema'
                type: array
                title: Response 500 Get Availability Zone Settings Svc V1 Availability Zones Settings Get
      security:
        - userPlaneApiToken: []
  /api/v1/availability-zones/{availability_zone_id}:
