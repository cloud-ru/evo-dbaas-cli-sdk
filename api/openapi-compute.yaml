          type: string
          format: uuid
          description: "Идентификатор проекта. [Узнать идентификатор проекта](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref__project-id?source-platform=Evolution) вы можете в личном кабинете или через API-запрос. Обязательный параметр."
        availability_zone_id:
          type: string
          format: uuid
          description: |
            Идентификатор зоны доступности.

            Обязательно укажите один из параметров: `availability_zone_id` или `availability_zone_name`. Нельзя указывать оба параметра одновременно или оставлять оба пустыми.
            Идентификатор зоны доступности можно получить, выполнив запрос [GET /api/v1/availability-zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Availability-Zones).
        availability_zone_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название зоны доступности. 

            Обязательно укажите один из параметров: `availability_zone_id` или `availability_zone_name`. 
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми.
            Название зоны доступности можно получить, выполнив запрос [GET /api/v1/availability-zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Availability-Zones).
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: "Название виртуальной машины. Обязательный параметр."
        description:
          type: string
          maxLength: 255
          minLength: 0
          description: Описание виртуальной машины.
          default: ''
        flavor_id:
          type: string
          format: uuid
          description: |
            Идентификатор флейвора.
            [Подробнее о флейворах](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__flavors?source-platform=Evolution). 
            
            Обязательно укажите один из параметров: `flavor_id` или `flavor_name`. 
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми. 
            Идентификатор флейвора можно получить, выполнив запрос [GET /api/v1/flavors](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Flavors/operation/get_flavors_svc_v1_flavors_get).
        flavor_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название флейвора.
            [Подробнее о флейворах](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__flavors?source-platform=Evolution).

            Обязательно укажите один из параметров: `flavor_id` или `flavor_name`. 
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми. 
            Название флейвора можно получить, выполнив запрос [GET /api/v1/flavors](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Flavors/operation/get_flavors_svc_v1_flavors_get).
        image_id:
          type: string
          format: uuid
          description: |
            Идентификатор образа. 
            Образ содержит файлы операционной системы, необходимые для создания ВМ. 
            [Подробнее об образах](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__images?source-platform=Evolution).

            Укажите один из параметров: `image_id` или `image_name`. 
            Нельзя указывать оба параметра одновременно.
            Идентификатор образа можно получить, выполнив запрос [GET /api/v1/images](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_images_svc_v1_images_get).
            
            Операционную систему ВМ можно развернуть с готового загрузочного диска. 
            В этом случает указывается диск в блоке `disks`, а параметры образа не задаются.
        image_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название образа. 
            Образ содержит файлы операционной системы, необходимые для создания ВМ. 
            [Подробнее об образах](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__images?source-platform=Evolution).

            Укажите один из параметров: `image_id` или `image_name`. Нельзя указывать оба параметра одновременно.
            Название образа можно получить, выполнив запрос [GET /api/v1/images](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_images_svc_v1_images_get).

            Операционную систему ВМ можно развернуть с готового загрузочного диска. 
            В этом случает указывается диск в блоке `disks`, а параметры образа не задаются.
        placement_group_id:
          type: string
          format: uuid
          description: |
            Идентификатор группы размещения. 
            [Подробнее о группах размещения](https://cloud.ru/docs/placement-groups/ug/topics/overview__limitations?source-platform=Evolution). 
            
            Чтобы добавить ВМ в группу размещения, укажите параметр `placement_group_id` или `placement_group_name`. 
            Нельзя указывать оба параметра одновременно. 
            Идентификатор группы размещения можно получить, выполнив запрос [GET /api/v1/placement-groups](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Placement-Groups/operation/get_placement_groups_svc_v1_placement_groups_get).
        placement_group_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название группы размещения. 
            [Подробнее о группах размещения](https://cloud.ru/docs/placement-groups/ug/topics/overview__limitations?source-platform=Evolution).
            
            Чтобы добавить ВМ в группу размещения, укажите параметр `placement_group_id` или `placement_group_name`. 
            Нельзя указывать оба параметра одновременно.  
            Название группы размещения можно получить, выполнив запрос [GET /api/v1/placement-groups](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Placement-Groups/operation/get_placement_groups_svc_v1_placement_groups_get).
        subnets:
          items:
            $ref: '#/components/schemas/VmCreateSubnetSection'
          type: array
          maxItems: 8
          minItems: 1
          description: |
            Подсети.
            В этом блоке указываются подсети, к которым будет подключена ВМ.
            Для каждого подключения можно указать IP-адрес ВМ в этой подсети, группы безопасности, а также один публичный IP-адрес в одной из подключенных подсетей.
            Если вы не укажете ни одной подсети, ВМ будет подключена к подсети по умолчанию в этой зоне доступности.

            Максимальное количество подсетей определяется [количеством PCI-слотов](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__flavors#pci) и зависит от конфигурации машины.
        disks:
          $ref: '#/components/schemas/api__models__vm_schemas__VmCreateDiskSection'
        metadata_fields:
          items:
            $ref: '#/components/schemas/VmCreateMetadataByIdSection'
          type: array
          description: |
            Метаданные образа.
            В метаданных передаются учетные данные пользователя, ключи, имя хоста ВМ и другие параметры.
            
            Список полей метаданных можно получить, выполнив запрос [GET /api/v1/images/{image_id}](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_image_by_id_svc_v1_images__image_id__get).
            
            Вы можете передать метаданные в блоке `metadata_fields` или `image_metadata`.
            Если оба блока указаны, в ВМ будут переданы значения блока `metadata_fields`.
        image_metadata:
          additionalProperties:
            type: string
          type: object
          description: |
            Метаданные образа.
            В метаданных передаются учетные данные пользователя, ключи, имя хоста ВМ и другие параметры.

            Список полей метаданных можно получить, выполнив запрос [GET /api/v1/images/{image_id}](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_image_by_id_svc_v1_images__image_id__get).

            При создании ВМ укажите каждое необходимое поле метаданных в виде пары `"ключ": "значение"`, где `"ключ"` — параметр `name` поля метаданных.
            Вы можете передать метаданные в блоке `metadata_fields` или `image_metadata`.
            Если оба блока указаны, в ВМ будут переданы значения блока `metadata_fields`.
        tag_ids:
          items:
            type: string
            format: uuid
          type: array
          description: |
            Идентификаторы тегов. 
            
            Чтобы назначить теги ВМ, укажите их в одном из параметров: `tag_ids` или `tag_names`. 
            Нельзя указывать оба параметра одновременно.
            Идентификаторы тегов можно получить, выполнив запрос `GET /api/tags/v1/tags`.
        tag_names:
          items:
            type: string
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          type: array
          description: |
            Названия тегов.

            Чтобы назначить теги ВМ, укажите их в одном из параметров: `tag_ids` или `tag_names`. 
            Нельзя указывать оба параметра одновременно.
            Названия тегов можно получить, выполнив запрос `GET /api/tags/v1/tags`.
        cloud_init:
          type: string
          description: "Шаблон [скрипта cloud-init](https://cloudinit.readthedocs.io/en/latest/explanation/introduction.html): позволяет автоматизировать начальную настройку виртуальной машины при первом запуске. В шаблоне передаются поля метаданных и пользовательских данных, которые автоматически подставятся при разворачивании виртуальной машины из образа. Например, в cloud-init можно передать имя хоста, IP-адрес, логин и пароль пользователя, SSH-ключи и другие параметры."
      additionalProperties: false
      type: object
      required:
        - project_id
        - name
        - disks
      title: PublicVmCreateRequest
    api__models__vm_schemas__PublicVmsCreateRequest:
      items:
        $ref: '#/components/schemas/api__models__vm_schemas__PublicVmCreateRequest'
      additionalProperties: false
      type: array
      title: PublicVmsCreateRequest
    api__models__vm_schemas__VmCreateDiskSection:
      items:
        anyOf:
          - $ref: '#/components/schemas/api__models__vm_schemas__VmCreateExistingDiskItem'
          - $ref: '#/components/schemas/api__models__vm_schemas__VmCreateNewDiskItem'
      additionalProperties: false
      type: array
      minItems: 1
      title: VmCreateDiskSection
      description: |
        Диски.
        При создании ВМ ей необходимо подключить загрузочный диск, с которого будет загружаться система:
        - Если в запросе вы указываете образ для развертывания системы, создайте новый диск, указав параметы блока `NewDisk`.
        - Если образ в запросе не указан, подключите существующий диск, указав параметры блока `ExistingDisk`.
          При этом выбранный диск должен быть загрузочным — `"bootable": true`, чтобы содержать образ для развертывания системы.

        Вы также можете подключить несколько дополнительных новых или существующих дисков, у которых `"bootable": false`.
        Максимальное количество дисков определяется [количеством PCI-слотов](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__flavors#pci) и зависит от конфигурации машины.

        [Подробнее о дисках](https://cloud.ru/docs/disks/ug/topics/concepts__disks?source-platform=Evolution)
    api__models__vm_schemas__VmCreateExistingDiskItem:
      properties:
        disk_id:
          type: string
          format: uuid
          description: |
            Идентификатор диска.

            Обязательно укажите один из параметров: `disk_id` или `disk_name`.
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми.
            Идентификатор диска можно получить, выполнив запрос [GET /api/v1/disks](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Disks/operation/get_disks_svc_v1_disks_get).
        disk_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название диска. 
            
            Обязательно укажите один из параметров: `disk_id` или `disk_name`. 
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми. 
            Название диска можно получить, выполнив запрос [GET /api/v1/disks](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Disks/operation/get_disks_svc_v1_disks_get).
      additionalProperties: false
      type: object
      title: ExistingDisk
      description: Существующий диск.
    api__models__vm_schemas__VmCreateNewDiskItem:
      properties:
        disk_type_id:
          type: string
          format: uuid
          description: |
            Идентификатор [типа диска](https://cloud.ru/docs/disks/ug/topics/overview__limitations?source-platform=Evolution#concepts-overview-limitations-disk-parameters). 
            
            Обязательно укажите один из параметров: `disk_id` или `disk_name`. 
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми. 
            Идентификатор типа диска можно получить, выполнив запрос [GET /api/v1/disk-types](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Disk-Types/operation/get_disk_types_svc_v1_disk_types_get).
        disk_type_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название [типа диска](https://cloud.ru/docs/disks/ug/topics/overview__limitations?source-platform=Evolution#concepts-overview-limitations-disk-parameters). 
            
            Обязательно укажите один из параметров: `disk_id` или `disk_name`. 
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми. 
            Идентификатор типа диска можно получить, выполнив запрос [GET /api/v1/disk-types](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Disk-Types/operation/get_disk_types_svc_v1_disk_types_get).
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: Название диска.
        size:
          type: integer
          maximum: 16384
          minimum: 1
          description: Размер диска в ГБ.
      additionalProperties: false
      type: object
      required:
        - name
        - size
      title: NewDisk
      description: Новый диск.
    VmOrderByFields:
      type: string
      enum:
        - created_time
        - name
      title: VmOrderByFields
      description: |
        Определяет поле, по которому будут отсортированы результаты: `created_time` — дата создания ВМ, `name` — название ВМ.
    RebuildVmRequestSchemaBody:
      properties:
        image_id:
          anyOf:
            - type: string
              format: uuid4
            - type: null
          description: |
            Идентификатор образа.

            Укажите один из параметров: `image_id` или `image_name`. 
            Нельзя указывать оба параметра одновременно.
            Идентификатор образа можно получить, выполнив запрос [GET /api/v1/images](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_images_svc_v1_images_get).
        image_name:
          anyOf:
            - type: string
            - type: null
          description: |
            Название образа.

            Укажите один из параметров: `image_id` или `image_name`. 
            Нельзя указывать оба параметра одновременно.
            Название образа можно получить, выполнив запрос [GET /api/v1/images](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_images_svc_v1_images_get).
        image_metadata:    
          anyOf:
            - type: object
            - type: null
          description: |
            Метаданные образа.
            В метаданных передаются учетные данные пользователя, ключи, имя хоста ВМ и другие параметры.

            Список полей метаданных можно получить, выполнив запрос [GET /api/v1/images/{image_id}](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_image_by_id_svc_v1_images__image_id__get).

            При создании ВМ укажите каждое необходимое поле метаданных в виде пары `"ключ": "значение"`, где `"ключ"` — параметр `name` поля метаданных.
            Вы можете передать метаданные в блоке `metadata_fields` или `image_metadata`.
            Если оба блока указаны, в ВМ будут переданы значения блока `metadata_fields`.
      additionalProperties: false
      type: object
      title: RebuildVmRequestSchemaBody
    RebuildVmResponseSchema:
      properties:
        id:
          type: string
          format: uuid4
          description: Идентификатор виртуальной машины
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: '^[a-zA-Z][a-zA-Z0-9.\-_]*$'
          description: Название виртуальной машны
        description:
          type: string
          maxLength: 255
          minLength: 0
          description: Описание виртуальной машины
        state:
          $ref: '#/components/schemas/VmState'
        locked:
          type: boolean
          description:  |
            Признак блокировки ВМ:
            - `true` — ВМ заблокирована для изменений.
            - `false` — ВМ доступна для изменений. 
        is_serial_ready:
          type: boolean
          description: "Если указано `true`, серийная консоль доступна на ВМ."
        guest_agent_state:
          $ref: '#/components/schemas/VmGuestAgentState'
          default: unavailable
        additional_properties:
          anyOf:
            - type: object
            - type: null
          description: Дополнительные параметры
        created_time:
          type: string
          format: date-time
          description: Дата и время создания.
        modified_time:
          anyOf:
            - type: string
              format: date-time
            - type: null
          description: Дата и время изменения.
        vnc_url:
          anyOf:
            - type: string
              minLength: 1
              format: uri
            - type: null
          description: URL виртуальной консоли.
        vnc_ws:
          anyOf:
            - type: string
              minLength: 1
              format: uri
            - type: null
          description: WebSocket URL виртуальной консоли.
        remote_console_url:
          anyOf:
            - type: string
              minLength: 1
              format: uri
            - type: null
          description: URL удаленной консоли.
        remote_console_ws:
          anyOf:
            - type: string
              minLength: 1
              format: uri
            - type: null
          description: WebSocket URL удаленной консоли.
        remote_console_protocol:
          anyOf:
            - $ref: '#/components/schemas/RemoteConsoleProtocol'
            - type: null
          description: Протокол удаленной консоли.  
        project:
          $ref: '#/components/schemas/ProjectLiteSchema'
          description: Проект.
        availability_zone:
          $ref: '#/components/schemas/AvailabilityZoneLiteSchema'
          description: Зона доступности.
        flavor:
          $ref: '#/components/schemas/FlavorLiteSchema'
          description: Флейвор.
        image:
          anyOf:
            - $ref: '#/components/schemas/VmImageLiteSchema'
            - type: null
          description: Образ. 
        image_metadata:
          items:
            $ref: '#/components/schemas/VmMetadataLiteSchema'
          type: array
          description: Метаданные образа.
        placement_group:
          anyOf:
            - $ref: '#/components/schemas/PlacementGroupLiteSchema'
            - type: null
        tags:
          items:
            $ref: '#/components/schemas/TagLiteSchema'
          type: array
          description: Теги
        disks:
          items:
            $ref: '#/components/schemas/VmDiskLiteSchema'
          type: array
          description: Диски
        interfaces:
          items:
            $ref: '#/components/schemas/InterfaceExtendedLiteSchema'
          type: array
          description: Интерфейсы
      type: object
      required:
        - id
        - name
        - description
        - state
        - locked
        - is_serial_ready
        - additional_properties
        - created_time
        - modified_time
        - vnc_url
        - vnc_ws
        - remote_console_url
        - remote_console_ws
        - remote_console_protocol
        - project
        - availability_zone
        - flavor
        - image
        - image_metadata
        - placement_group
        - tags
        - disks
        - interfaces
      title: RebuildVmResponseSchema
    BulkDeleteVmRequest:
      items:
        $ref: '#/components/schemas/BulkDeleteVmRequestSchemaBody'
      type: array
      minItems: 1
