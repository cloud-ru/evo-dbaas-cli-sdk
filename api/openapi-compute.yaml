components:
  schemas:
    APIExceptionSchema:
      properties:
        code:
          type: string
          description: Код ошибки.
        message:
          type: string
          description: Описание ошибки.
      type: object
      required:
        - code
        - message
      title: APIExceptionSchema
      example:
        message: Service is unavailable, retry later
        code: service_unavailable_error
    AllowedAddressPairMiniResponse:
      properties:
        ip_address:
          anyOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv4PrivateNetwork
          description: IP-адрес.
        mac_address:
          type: string
          description: MAC-адрес
      type: object
      required:
        - ip_address
        - mac_address
      title: AllowedAddressPairMiniResponse
    AllowedAddressPairScheme:
      properties:
        ip_address:
          anyOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv4PrivateNetwork
          description: IP-адрес.
        mac_address:
          type: string
          maxLength: 17
          minLength: 12
          description: MAC-адрес
      additionalProperties: false
      type: object
      required:
        - ip_address
      title: AllowedAddressPairScheme
    AuthForbiddenExceptionSchema:
      properties:
        code:
          type: string
          description: Код ошибки.
        message:
          type: string
          description: Описание ошибки.
      type: object
      required:
        - code
        - message
      title: AuthForbiddenExceptionSchema
      example:
        message: Forbidden
        code: forbidden
    AuthUnauthorizedExceptionSchema:
      properties:
        code:
          type: string
          description: Код ошибки.
        message:
          type: string
          description: Описание ошибки.
      type: object
      required:
        - code
        - message
      title: AuthUnauthorizedExceptionSchema
      example:
        message: Unauthorized
        code: unauthorized
    AvailabilityZoneMiniResponse:
      properties:
        id:
          type: string
          format: uuid4
          description: Идентификатор зоны доступности.
        name:
          type: string
          description: Название зоны доступности.
      type: object
      required:
        - id
        - name
      description: Зона доступности.
    AvailabilityZoneNotFoundExceptionSchema:
      properties:
        code:
          type: string
          description: Код ошибки.
        message:
          type: string
          description: Описание ошибки.
      type: object
      required:
        - code
        - message
      title: AvailabilityZoneNotFoundExceptionSchema
      example:
        message: Availability zone with this id is not found
        code: not_found
    BackupAction:
      type: string
      enum:
        - restore
      description: |
        Действие с резервной копией.
        Доступно только значение ``restore`` — восстановление ресурса из копии.
    BackupDiskResourceStateDiskMountSection:
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор записи.
        vm_id:
          type: string
          format: uuid
          description: Идентификатор виртуальной машины.
        disk_id:
          type: string
          format: uuid
          description: Идентификатор диска.
        mode:
          type: string
          description: "Режим доступа: `rw` — чтение и запись, `ro` — только чтение."
        hidden:
          type: boolean
          description: Признак скрытого объекта.
        mount_point:
          type: string
          description: Точка монтирования.
        primary:
          type: boolean
          description: "Если указано `true`, диск является загрузочным для ВМ."
        user_id:
          type: string
          format: uuid
          description: Идентификатор пользователя.
        vm:
          $ref: '#/components/schemas/BackupDiskResourceStateDiskMountVmSection'
      type: object
      required:
        - id
        - vm_id
        - disk_id
        - mode
        - hidden
        - mount_point
        - primary
        - user_id
        - vm
      title: BackupDiskResourceStateDiskMountSection
      description: Записи о монтировании.
    BackupDiskResourceStateDiskMountVmSection:
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор виртуальной машины.
        name:
          type: string
