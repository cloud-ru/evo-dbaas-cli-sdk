openapi: 3.1.0
info:
  title: SVC Public API
  version: 0.1.0
  description: '[Документация сервиса «Виртуальные машины»](https://cloud.ru/docs/virtual-machines/ug/index.html)'
  contact:
    email: support@cloud.ru
paths:
  /api/v1/flavors:
    get:
      tags:
        - Flavors
      summary: Получение списка флейворов
      operationId: get_flavors_svc_v1_flavors_get
      parameters:
        - required: false
          schema:
            type: string
            enum:
              - created_time
            default: created_time
          name: order_by
          description: |
            Определяет параметр, по которому будут отсортированы результаты:
            - `created_time` — дата и время создания флейвора.
          in: query
        - required: false
          schema:
            type: boolean
            default: true
          name: order_desc
          description: |
            Направление сортировки:
            - `true` — по убыванию.
            - `false` — по возрастанию.
          in: query
        - required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          name: offset
          description: "Количество элементов с начала списка, которые будут пропущены."
          in: query
        - required: false
          schema:
            type: integer
            maximum: 100
            minimum: 0
            exclusiveMinimum: true
            default: 50
          name: limit
          description: "Максимальное количество элементов в списке."
          in: query
        - required: false
          schema:
            type: string
            format: uuid4
          name: availability_zone_id
          description: "Фильтр по зоне доступности. Идентификаторы зон доступности можно получить, выполнив запрос [GET /api/v1/availability-zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Availability-Zones)."
          in: query
        - required: false
          schema:
            type: string
            format: uuid4
          name: project_id
          description: "Идентификатор проекта. [Узнать идентификатор проекта](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref__project-id?source-platform=Evolution) вы можете в личном кабинете или через API-запрос."
          in: query
        - required: false
          schema:
            type: string
            maxLength: 64
            minLength: 1
          name: name
          description: "Фильтр по названию флейвора."
          in: query
        - required: false
          schema:
            type: integer
            maximum: 128
            minimum: 0
            exclusiveMinimum: true
          name: cpu
          description: "Фильтр по количеству виртуальных процессоров — vCPU."
          in: query
        - required: false
          schema:
            type: integer
            maximum: 1024
            minimum: 0
            exclusiveMinimum: true
          name: ram
          description: "Фильтр по объему оперативной памяти (RAM) в ГБ."
          in: query
        - required: false
          schema:
            type: integer
            maximum: 16
            minimum: 0
          name: gpu
          description: "Фильтр по количеству графических процессоров — GPU."
          in: query
        - required: false
          schema:
            type: string
          name: flavor_type
          description: "Фильтр по названию типа флейвора. Узнать доступные типы флейворов можно, выполнив запрос `GET api/v1/flavor-types`. Названию соответствует поле `name`."
          in: query
        - name: type
          in: query
          required: false
          deprecated: true
          schema:
            type: string
          description: "Фильтр по названию типа флейвора. Узнать доступные типы флейворов можно, выполнив запрос `GET api/v1/flavor-types`. Названию соответствует поле `old_name`."
        - required: false
          schema:
            type: string
          name: oversubscription
          description: "Фильтр по гарантированной доле vCPU: `1:1` — 100%, `1:3` — 30%, `1:10` — 10%."
          in: query
        - name: free_tier
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Фильтр по флейворам для бесплатных виртуальных машин (free tier):
            - `true` — только флейворы для бесплатных виртуальных машин.
            - `false` — только флейворы для платных виртуальных машин.
        - name: is_spot
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Фильтр по флейворам с поддержкой [прерываемых виртуальных машин](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__spot):
            - `true` — только флейворы с поддержкой прерываемых виртуальных машин.
            - `false` — только флейворы без поддержки прерываемых виртуальных машин.
      responses:
        '200':
          description: Запрос выполнен успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResponse_PublicFlavorResponse_'
        '401':
          description: Ошибка аутентификации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthUnauthorizedExceptionSchema'
                type: array
                title: Response 401 Get Flavors Svc V1 Flavors Get
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthForbiddenExceptionSchema'
                type: array
                title: Response 403 Get Flavors Svc V1 Flavors Get
        '404':
          description: Не удалось найти зону доступности с указанным идентификатором
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AvailabilityZoneNotFoundExceptionSchema'
                type: array
                title: Response 404 Get Flavors Svc V1 Flavors Get
        '422':
          description: Не удалось найти проект с указанным идентификатором
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WrongProjectExceptionSchema'
                type: array
                title: Response 422 Get Flavors Svc V1 Flavors Get
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIExceptionSchema'
                type: array
                title: Response 500 Get Flavors Svc V1 Flavors Get
      security:
        - userPlaneApiToken: []
  /api/v1/flavors/{flavor_id}:
    get:
      tags:
        - Flavors
      summary: Получение информации о флейворе
      operationId: get_flavor_by_id_svc_v1_flavors__flavor_id__get
      parameters:
        - required: true
          schema:
            type: string
            format: uuid4
          name: flavor_id
          description: Идентификатор флейвора.
          in: path
      responses:
        '200':
          description: Запрос выполнен успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlavorResponse'
        '401':
          description: Ошибка аутентификации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthUnauthorizedExceptionSchema'
                type: array
                title: Response 401 Get Flavor By Id Svc V1 Flavors  Flavor Id  Get
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthForbiddenExceptionSchema'
                type: array
                title: Response 403 Get Flavor By Id Svc V1 Flavors  Flavor Id  Get
        '404':
          description: Не удалось найти флейвор с указанным идентификатором
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FlavorNotFoundExceptionSchema'
                type: array
                title: Response 404 Get Flavor By Id Svc V1 Flavors  Flavor Id  Get
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomRequestValidationErrorSchema'
                type: array
                title: Response 422 Get Flavor By Id Svc V1 Flavors  Flavor Id  Get
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIExceptionSchema'
                type: array
                title: Response 500 Get Flavor By Id Svc V1 Flavors  Flavor Id  Get
      security:
        - userPlaneApiToken: []
  /api/v1/availability-zones:
    get:
      tags:
        - Availability Zones
      summary: Получение списка зон доступности
      operationId: get_availability_zone_list_svc_v1_availability_zones_get
      parameters:
        - required: false
          schema:
            type: string
            format: uuid4
          name: project_id
          description: "Идентификатор проекта. [Узнать идентификатор проекта](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref__project-id?source-platform=Evolution) вы можете в личном кабинете или через API-запрос."
          in: query
        - required: false
          schema:
            type: boolean
          name: free_tier_default
          description: "Eсли указано `true`, в ответе вернутся только зоны доступности, в которых можно создать бесплатные ресурсы (free tier)."
          in: query
      responses:
        '200':
          description: Запрос выполнен успешно
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicAvailabilityZoneResponse'
                type: array
                title: Response Get Availability Zone List Svc V1 Availability Zones Get
        '401':
          description: Ошибка аутентификации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthUnauthorizedExceptionSchema'
                type: array
                title: Response 401 Get Availability Zone List Svc V1 Availability Zones Get
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthForbiddenExceptionSchema'
                type: array
                title: Response 403 Get Availability Zone List Svc V1 Availability Zones Get
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomRequestValidationErrorSchema'
                type: array
                title: Response 422 Get Availability Zone List Svc V1 Availability Zones Get
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIExceptionSchema'
                type: array
                title: Response 500 Get Availability Zone List Svc V1 Availability Zones Get
      security:
        - userPlaneApiToken: []
  /api/v1/availability-zones/settings:
