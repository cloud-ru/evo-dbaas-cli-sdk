    FreetierVmCreateRequest:
      properties:
        project_id:
          type: string
          format: uuid
          description: "Идентификатор проекта. [Узнать идентификатор проекта](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref__project-id?source-platform=Evolution) вы можете в личном кабинете или через API-запрос. Обязательный параметр."
        availability_zone_id:
          type: string
          format: uuid
          description: |
            Идентификатор зоны доступности. 
            Если не указать зону доступности, ВМ будет создана в зоне доступности по умолчанию для free tier ВМ.

            Идентификатор зоны доступности можно получить, выполнив запрос [GET /api/v1/availability-zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Availability-Zones).
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: "Название виртуальной машины. Обязательный параметр."
        image_id:
          type: string
          format: uuid
          description: |
            Идентификатор образа. 
            Образ содержит файлы операционной системы, необходимые для создания ВМ. 
            [Подробнее об образах](https://cloud.ru/docs/virtual-machines/ug/topics/concepts__images?source-platform=Evolution).

            Для создания бесплатной ВМ образ должен поддерживать free tier. 
            Получить список доступных образов можно с помощью запроса [GET /api/v1/images](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_images_svc_v1_images_get) с параметром `"free_tier_enabled": true`.
        metadata_fields:
          items:
            $ref: '#/components/schemas/VmCreateMetadataByIdSection'
          type: array
          description: |
            Метаданные образа.
            В метаданных передаются учетные данные пользователя, ключи, имя хоста ВМ и другие параметры.

            Список полей метаданных можно узнать с помощью запроса [GET /api/v1/images/{image_id}](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_image_by_id_svc_v1_images__image_id__get).
            
            Вы можете передать метаданные в блоке `metadata_fields` или `image_metadata`.
            Если оба блока указаны, в ВМ будут переданы значения блока `metadata_fields`.
        image_metadata:
          additionalProperties:
            type: string
          type: object
          description: |
            Метаданные образа.
            В метаданных передаются учетные данные пользователя, ключи, имя хоста ВМ и другие параметры.

            Список полей метаданных можно узнать с помощью запроса [GET /api/v1/images/{image_id}](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Images/operation/get_image_by_id_svc_v1_images__image_id__get).

            При создании ВМ укажите каждое необходимое поле метаданных в виде пары `"ключ": "значение"`, где `"ключ"` — параметр `name` поля метаданных.
            Вы можете передать метаданные в блоке `metadata_fields` или `image_metadata`.
            Если оба блока указаны, в ВМ будут переданы значения блока `metadata_fields`.
        new_floating_ip:
          type: boolean
          description: "Если выбрано `true`, сетевому интерфейсу будет назначен новый публичный IP-адрес."
          default: false
      additionalProperties: false
      type: object
      required:
        - project_id
        - name
        - image_id
      title: FreetierVmCreateRequest
