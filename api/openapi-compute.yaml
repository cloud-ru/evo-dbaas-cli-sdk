        disk_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z][a-zA-Z0-9.\-_]*$
          description: |
            Название диска.

            Обязательно укажите один из параметров: `disk_id` или `disk_name`.
            Нельзя указывать оба параметра одновременно или оставлять оба пустыми. 
            Названия доступных дисков можно получить, выполнив запрос [GET /api/v1/disks](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3?source-platform=#tag/Disks/operation/get_disks_svc_v1_disks_get).
      additionalProperties: false
      type: object
      title: ExistingDisk
      description: Существующий диск.
