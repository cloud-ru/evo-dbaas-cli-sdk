    get:
      tags:
        - ProtectionPlans
      summary: Получение списка планов резервного копирования
      operationId: list_protection_plans_svc_v1_protection_plans_get
      security:
        - userPlaneApiToken: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            description: Количество элементов с начала списка, которые будут пропущены.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 50
            description: Максимальное количество элементов в списке.
        - name: order_by
          in: query
          required: false
          schema:
            enum:
              - created_at
              - updated_at
            type: string
            description: |
              Определяет параметр, по которому будут отсортированы результаты:

              - ``created_at`` — дата и время создания плана.
              - ``updated_at`` — дата и время обновления плана.

              По умолчанию сортировка не выполняется — параметр не указан.
        - name: order_desc
          in: query
          required: false
          schema:
            type: boolean
            default: true
            description: |
              Направление сортировки:

              - ``true`` — по убыванию.
              - ``false`` — по возрастанию.

              По умолчанию сортировка не выполняется — параметр не указан.
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid4
            description: "Фильтр по идентификатору проекта. [Узнать идентификатор проекта](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref__project-id?source-platform=Evolution) вы можете в личном кабинете или через API-запрос. Обязательный параметр."
        - name: backup_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid4
              - type: null
            description: "Фильтр по идентификатору резервной копии."
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 64
              - type: null
            description: "Фильтр по названию плана копирования. Названия планов копирования можно получить, выполнив этот же запрос без фильтрации."
        - name: state
          in: query
          required: false
          schema: 
            $ref: '#/components/schemas/ProtectionPlanState'
          description: Фильтр по статусу плана копирования.
        - name: resource_ids
          in: query
          required: false
          schema:
            type: string
            format: uuid4
            description: Фильтр по идентификаторам ресурсов, включенных в план резервного копирования. Если необходимо указать несколько идентификаторов, передайте каждый из них в отдельном параметре. В ответе вернутся планы копирования, которые содержат хотя бы один из указанных ресурсов.
        - name: resource_types
          in: query
          required: false
          schema: 
            $ref: '#/components/schemas/ResourceType'
          description: |
              Фильтр по типам ресурсов, включенных в план резервного копирования:

              - `virtual_machine` — виртуальные машины;
              - `disk` — диски.

              Если необходимо указать несколько типов, передайте каждый из них в отдельном параметре.
              В ответе вернутся планы копирования, которые содержат хотя бы один из указанных типов ресурсов.
        - name: type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/BackupType'
              - type: null
            description: |
              Фильтр по типу резервных копий:

              - `full` — план для создания полных копий;
              - `incremental` — план для создания инкрементальных копий.
      responses:
        '200':
          description: Запрос выполнен успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProtectionPlansResponseSchema'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
