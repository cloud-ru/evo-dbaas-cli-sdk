openapi: 3.0.3
info:
    title: Cloud.ru Managed OpenSearch API
    description: '[Документация Managed OpenSearch](https://cloud.ru/docs/opensearch/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: 1.0.0
servers:
    - url: https://opensearch.api.cloud.ru
paths:
    /v1/clusters:
        get:
            tags:
                - ClusterService
            description: Получение списка кластеров.
            operationId: ClusterService_List
            parameters:
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `opensearch`.
                  schema:
                    type: string
                - name: project_id
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице ответа.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.ListClustersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - ClusterService
            description: Создание кластера.
            operationId: ClusterService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}:
        get:
            tags:
                - ClusterService
            description: Получение информации о кластере.
            operationId: ClusterService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Cluster'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - ClusterService
            description: Удаление кластера.
            operationId: ClusterService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        patch:
            tags:
                - ClusterService
            description: Изменение кластера.
            operationId: ClusterService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.UpdateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/operations:
        get:
            tags:
                - ClusterService
            description: Получение списка операций, произведенных над кластером.
            operationId: ClusterService_ListOperations
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице ответа.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.ListOperationsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/snapshots:
        get:
            tags:
                - SnapshotService
            description: Получение списка снапшотов.
            operationId: SnapshotService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.ListSnapshotsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - SnapshotService
            description: Создание снапшота.
            operationId: SnapshotService_Create
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.CreateSnapshotRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/snapshots/{snapshot_name}:
        get:
            tags:
                - SnapshotService
            description: Получение снапшота.
            operationId: SnapshotService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: snapshot_name
                  in: path
                  description: Имя снапшота.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Snapshot'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - SnapshotService
            description: Удаление снапшота.
            operationId: SnapshotService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: snapshot_name
                  in: path
                  description: Имя снапшота.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/operations/{operation_id}:
        get:
            tags:
                - OperationService
            description: Получение информации об операции по идентификатору.
            operationId: OperationService_Get
            parameters:
                - name: operation_id
                  in: path
                  description: Идентификатор операции.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/specifications:
        get:
            tags:
                - SpecificationService
            description: Получение списка спецификаций.
            operationId: SpecificationService_List
            parameters:
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `opensearch`.
                  schema:
                    type: string
                - name: version
                  in: query
                  description: Версия продукта.
                  schema:
                    type: string
                - name: availability_zone_id
                  in: query
                  description: |-
                    Идентификатор зоны доступности.

                     Список зон доступности и их описание можно получить через API сервиса виртуальных машин
                     в разделе [Availability Zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Availability-Zones).
                  schema:
                    type: string
                - name: cluster_id
                  in: query
                  description: |-
                    Идентификатор кластера.
                     Укажите для получения спецификаций, доступных для вертикального масштабирования кластера.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.ListSpecificationsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/specifications/{specification_id}:
        get:
            tags:
                - SpecificationService
            description: Получение спецификации.
            operationId: SpecificationService_Get
            parameters:
                - name: specification_id
                  in: path
                  description: Идентификатор спецификации.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Specification'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/versions:
        get:
            tags:
                - VersionService
            description: Получение списка версий.
            operationId: VersionService_List
            parameters:
                - name: product_type
                  in: query
                  description: Название продукта. По умолчанию `opensearch`.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.ListVersionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
components:
    schemas:
        cloudru.dbaas.opensearch.v1.Cluster:
            required:
                - name
                - version
                - specification_id
                - data_nodes
                - data_nodes_disk_size_gib
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: awesome-opensearch-cluster
                    type: string
                    description: Имя кластера.
                description:
                    example: Production OpenSearch cluster
                    type: string
                    description: Описание кластера.
                version:
                    example: 2.18.0
                    type: string
                    description: Версия кластера.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера.
                health:
                    readOnly: true
                    example: HEALTHY
                    enum:
                        - HEALTH_UNSPECIFIED
                        - HEALTHY
                        - UNHEALTHY
                    type: string
                    description: Состояние здоровья кластера.
                    format: enum
                status:
                    readOnly: true
                    example: READY
                    enum:
                        - STATUS_UNSPECIFIED
                        - PENDING
                        - DEPLOYING
                        - FAILED
                        - UPDATING
                        - READY
                        - SUSPENDED
                        - SUSPENDING
                        - ERASED
                        - ERASING
                        - ROLLING_BACK
                    type: string
                    description: Статус кластера.
                    format: enum
                created_at:
                    readOnly: true
                    example: 2026-01-01T10:30:00Z
                    type: string
                    description: Дата создания кластера.
                    format: date-time
                hosts:
                    example: ["00000000-0000-0000-0000-000000000000.opensearch.cloud.ru:9200"]
                    type: array
                    items:
                        type: string
                    description: Адреса кластера.
                data_nodes:
                    example: 3
                    type: integer
                    description: Количество дата-узлов.
                    format: int32
                data_nodes_disk_size_gib:
                    example: 100
                    type: integer
                    description: Размер диска дата-узлов в гибибайтах.
                    format: int32
                master_nodes:
                    example: 3
                    type: integer
                    description: Количество мастер-узлов.
                    format: int32
                master_nodes_disk_size_gib:
                    example: 50
                    type: integer
                    description: Размер диска мастер-узлов в гибибайтах.
                    format: int32
                snapshots_schedule:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.SnapshotsSchedule'
                    description: Расписание снапшотов.
                data_nodes_subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы подсетей дата-узлов. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер будет мультизональным.
                         При указании одной подсети кластер будет однозональным.
                         Каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                master_nodes_subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы подсетей мастер-узлов. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер будет мультизональным.
                         При указании одной подсети кластер будет однозональным.
                         Каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
            description: Кластер OpenSearch.
        cloudru.dbaas.opensearch.v1.CreateClusterRequest:
            required:
                - name
                - version
                - specification_id
                - project_id
                - data_nodes
                - data_nodes_disk_size_gib
            type: object
            properties:
                name:
                    example: awesome-opensearch-cluster
                    type: string
                    description: Название кластера.
                description:
                    example: Production OpenSearch cluster
                    type: string
                    description: Описание кластера.
                version:
                    example: 2.18.0
                    type: string
                    description: Версия кластера.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера.
                subnet_id:
                    example: 00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: |-
                        Идентификатор подсети.

                         Deprecated: Используйте поля `data_nodes_subnet_ids` и `master_nodes_subnet_ids`.
                project_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                data_nodes:
                    example: 3
                    type: integer
                    description: Количество дата-узлов.
                    format: int32
                data_nodes_disk_size_gib:
                    example: 100
                    type: integer
                    description: Размер диска дата-узлов в гибибайтах.
                    format: int32
                master_nodes:
                    example: 3
                    type: integer
                    description: Количество мастер-узлов.
                    format: int32
                master_nodes_disk_size_gib:
                    example: 25
                    type: integer
                    description: Размер диска мастер-узлов в гибибайтах.
                    format: int32
                snapshots_schedule:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.SnapshotsSchedule'
                    description: Расписание снапшотов.
                restore:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Restore'
                    description: Восстановление кластера.
                data_nodes_subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы подсетей дата-узлов. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер будет мультизональным.
                         При указании одной подсети кластер будет однозональным.
                         Каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                master_nodes_subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы подсетей мастер-узлов. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер будет мультизональным.
                         При указании одной подсети кластер будет однозональным.
                         Каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
            description: Запрос на создание кластера.
        cloudru.dbaas.opensearch.v1.CreateSnapshotRequest:
            required:
                - cluster_id
                - snapshot_name
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                snapshot_name:
                    example: snapshot-name
                    type: string
                    description: Имя снапшота.
            description: Запрос на создание снапшота.
        cloudru.dbaas.opensearch.v1.ListClustersResponse:
            type: object
            properties:
                clusters:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Cluster'
                    description: Список всех кластеров в текущем проекте.
                next_page_token:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Токен следующей страницы с результатами.
            description: Ответ на запрос на получение списка кластеров текущего проекта.
        cloudru.dbaas.opensearch.v1.ListOperationsResponse:
            type: object
            properties:
                operations:
                    readOnly: true
                    example: [{"name": "create-cluster", "status": "DONE", "created_at": "2024-01-15T10:30:00Z"}, {"name": "update-cluster", "status": "RUNNING", "created_at": "2024-01-15T11:45:00Z"}]
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                    description: Список операций, выполненных над заданным кластером.
                next_page_token:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Токен следующей страницы с результатами.
            description: Ответ на запрос на получение списка операций кластера.
        cloudru.dbaas.opensearch.v1.ListSnapshotsResponse:
            type: object
            properties:
                snapshots:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Snapshot'
                    description: Список снапшотов.
            description: Ответ на запрос на получение списка снапшотов.
        cloudru.dbaas.opensearch.v1.ListSpecificationsResponse:
            type: object
            properties:
                specifications:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Specification'
                    description: Список спецификаций, доступных для определенной версии продукта.
            description: Ответ на запрос на получение спецификаций.
        cloudru.dbaas.opensearch.v1.ListVersionsResponse:
            type: object
            properties:
                versions:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.Version'
                    description: Список версий.
            description: Ответ на запрос на получение списка доступных версий продукта.
        cloudru.dbaas.opensearch.v1.Restore:
            required:
                - enabled
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: Восстановление включено.
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера, из которого будет выполнено восстановление.
                snapshot_name:
                    example: snapshot-name
                    type: string
                    description: Имя снапшота, из которого будет выполнено восстановление.
            description: Параметры восстановления кластера.
        cloudru.dbaas.opensearch.v1.Snapshot:
            required:
                - name
            type: object
            properties:
                name:
                    example: snapshot-name
                    type: string
                    description: Имя снапшота.
                state:
                    readOnly: true
                    example: IN_PROGRESS
                    enum:
                        - SNAPSHOT_STATE_UNSPECIFIED
                        - SNAPSHOT_STATE_IN_PROGRESS
                        - SNAPSHOT_STATE_SUCCESS
                        - SNAPSHOT_STATE_FAILED
                        - SNAPSHOT_STATE_PARTIAL
                        - SNAPSHOT_STATE_PENDING
                        - SNAPSHOT_STATE_DELETING
                    type: string
                    description: Состояние снапшота.
                    format: enum
                indexes_count:
                    readOnly: true
                    example: 2
                    type: string
                    description: Количество индексов в снапшоте.
                    format: int64
                start_time:
                    readOnly: true
                    example: 2026-01-01T10:30:00Z
                    type: string
                    description: Время запуска выполнения снапшота.
                    format: date-time
                end_time:
                    readOnly: true
                    example: 2026-01-01T11:30:00Z
                    type: string
                    description: Время завершения выполнения снапшота.
                    format: date-time
            description: Снапшот.
        cloudru.dbaas.opensearch.v1.SnapshotsSchedule:
            required:
                - enabled
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: Если `true`, включено автоматическое создание снапшотов по расписанию.
                cron:
                    example: 15 14 * * *
                    type: string
                    description: |-
                        Расписание в формате CRON-выражения GMT +3 (Москва).
                         Например, выражение `15 14 * * *` будет запускать задачу каждый день в 14:15.
                         Краткий формат вида `@midnight` или `@every 1h30m` не поддерживается.
                         Резервное копирование может происходить не чаще, чем раз в 6 часов.
                retention_days:
                    example: 2
                    type: string
                    description: |-
                        Срок хранения снапшотов.
                         Минимальное значение — 2 дня, максимальное значение — 60 дней.
                    format: int64
            description: Расписание снапшотов.
        cloudru.dbaas.opensearch.v1.Specification:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации.
                name:
                    readOnly: true
                    example: specification-name
                    type: string
                    description: Название спецификации.
                data_nodes_cpu:
                    readOnly: true
                    example: 4
                    type: number
                    description: Количество виртуальных ядер процессора дата-узлов.
                    format: double
                data_nodes_memory:
                    readOnly: true
                    example: 16
                    type: number
                    description: Объем оперативной памяти дата-узлов в гигабайтах.
                    format: double
                data_nodes_flavor_type:
                    readOnly: true
                    example: BALANCE
                    enum:
                        - FLAVOR_TYPE_UNSPECIFIED
                        - MEMORY
                        - CPU
                        - BALANCE
                    type: string
                    description: |-
                        Категория флейвора дата-узлов. Возможные значения:
                          - `cpu` — содержит флейворы с увеличенной долей ядер процессора. Соотношение vCPU к RAM 1:1 и 1:2.
                          - `balance` — содержит флейворы с оптимальным соотношением vCPU к RAM 1:4.
                          - `memory` — содержит флейворы с увеличенной долей оперативной памяти. Соотношение vCPU к RAM 1:8 и 1:16.
                    format: enum
                master_nodes_cpu:
                    example: 2
                    type: number
                    description: Количество виртуальных ядер процессора мастер-узлов.
                    format: double
                master_nodes_memory:
                    example: 8
                    type: number
                    description: Объем оперативной памяти мастер-узлов в гигабайтах.
                    format: double
                master_flavor_type:
                    example: BALANCE
                    enum:
                        - FLAVOR_TYPE_UNSPECIFIED
                        - MEMORY
                        - CPU
                        - BALANCE
                    type: string
                    description: |-
                        Категория флейвора мастер-узлов. Возможные значения:
                          - `cpu` — содержит флейворы с увеличенной долей ядер процессора. Соотношение vCPU к RAM 1:1 и 1:2.
                          - `balance` — содержит флейворы с оптимальным соотношением vCPU к RAM 1:4.
                          - `memory` — содержит флейворы с увеличенной долей оперативной памяти. Соотношение vCPU к RAM 1:8 и 1:16.
                    format: enum
                min_data_nodes_storage_gigs:
                    readOnly: true
                    example: 40
                    type: integer
                    description: Минимальный размер диска дата-узлов в гигабайтах.
                    format: int32
                min_data_nodes:
                    readOnly: true
                    example: 3
                    type: integer
                    description: Минимальное количество дата-узлов.
                    format: int32
                max_data_nodes:
                    readOnly: true
                    example: 6
                    type: integer
                    description: Максимальное количество дата-узлов.
                    format: int32
                min_master_nodes_storage_gigs:
                    example: 10
                    type: integer
                    description: Минимальный размер диска мастер-узлов в гигабайтах.
                    format: int32
                min_master_nodes:
                    example: 3
                    type: integer
                    description: Минимальное количество мастер-узлов.
                    format: int32
                max_master_nodes:
                    example: 3
                    type: integer
                    description: Максимальное количество мастер-узлов.
                    format: int32
            description: Спецификация OpenSearch
        cloudru.dbaas.opensearch.v1.UpdateClusterRequest:
            required:
                - cluster_id
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации, назначенной кластеру.
                data_nodes:
                    example: 5
                    type: integer
                    description: Количество дата-узлов.
                    format: int32
                master_nodes:
                    example: 3
                    type: integer
                    description: Количество мастер-узлов.
                    format: int32
                snapshots_schedule:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.opensearch.v1.SnapshotsSchedule'
                    description: Расписание снапшотов.
                data_nodes_disk_size_gib:
                    example: 120
                    type: integer
                    description: Размер диска дата-узлов в гибибайтах.
                    format: int32
                master_nodes_disk_size_gib:
                    example: 50
                    type: integer
                    description: Размер диска мастер-узлов в гибибайтах.
                    format: int32
                data_nodes_subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Идентификаторы подсетей дата-узлов. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер будет мультизональным.
                         При указании одной подсети кластер будет однозональным.
                         Каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                master_nodes_subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"]
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Идентификаторы подсетей мастер-узлов. Подсети определяют зоны доступности кластера.

                         Если указано несколько подсетей, кластер будет мультизональным.
                         При указании одной подсети кластер будет однозональным.
                         Каждая подсеть должна находиться в отдельной зоне доступности.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
            description: Запрос на изменение кластера.
        cloudru.dbaas.opensearch.v1.Version:
            type: object
            properties:
                name:
                    readOnly: true
                    example: 2.18.0
                    type: string
                    description: Версия продукта.
            description: Версия OpenSearch.
        cloudru.dbaas.operation.Operation:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор операции.
                resource_name:
                    readOnly: true
                    example: urn:cloud:postgresql::265c6f28-9c84-4cef-bbc5-4472c1743bc0:backend
                    type: string
                    description: Информация о ресурсе, над которым производится операция.
                    format: urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT
                resource_id:
                    readOnly: true
                    example: 54295782-7aef-43e6-b33b-c9735938677a
                    type: string
                    description: Уникальный идентификатор ресурса, над которым производится операция.
                created_at:
                    readOnly: true
                    type: string
                    description: Время создания операции.
                    format: date-time
                updated_at:
                    readOnly: true
                    type: string
                    description: Время последнего изменения операции.
                    format: date-time
                done:
                    readOnly: true
                    type: boolean
                    description: |-
                        Флаг завершенности операции:
                         - `true` — операция завершена. Операция считается завершенной, даже если в ходе ее выполнения возникла ошибка.
                         - `false` — операция не завершена.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
                    description: Результат операции в случае ошибки.
        cloudru.protobuf.v1.RepeatedString:
            type: object
            properties:
                value:
                    type: array
                    items:
                        type: string
                    description: The repeated string value.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: URL-адрес или имя ресурса, которое определяет тип сериализованного сообщения.
            additionalProperties: true
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: Код ошибки.
                    format: int32
                message:
                    type: string
                    description: Описание ошибки.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: Дополнительная информация об ошибке.
            description: Ошибка.
tags:
    - name: ClusterService
      description: Управление кластерами OpenSearch.
    - name: OperationService
      description: Управление операциями OpenSearch.
    - name: SnapshotService
      description: Управление снапшотами.
    - name: SpecificationService
      description: Управление спецификациями OpenSearch.
    - name: VersionService
      description: Управление версиями OpenSearch.
