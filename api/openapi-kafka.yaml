openapi: 3.0.3
info:
    title: Cloud.ru Managed Kafka API
    description: '[Документация Managed Kafka](https://cloud.ru/docs/paas-kafka/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: 1.0.0
servers:
    - url: https://kafka.api.cloud.ru
paths:
    /v1/clusters:
        get:
            tags:
                - ClusterService
            description: Получение списка кластеров.
            operationId: ClusterService_List
            parameters:
                - name: product_type
                  in: query
                  description:  |
                    Название продукта. 
            
                    Укажите `kafka`. 
                  schema:
                    type: string
                - name: project_id
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице ответа.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListClustersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - ClusterService
            description: Создание кластера.
            operationId: ClusterService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}:
        get:
            tags:
                - ClusterService
            description: Получение информации о кластере.
            operationId: ClusterService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.Cluster'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - ClusterService
            description: Удаление кластера.
            operationId: ClusterService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        patch:
            tags:
                - ClusterService
            description: Изменение ресурсов кластера.
            operationId: ClusterService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.UpdateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/operations:
        get:
            tags:
                - ClusterService
            description: Получение списка операций, произведенных над кластером.
            operationId: ClusterService_ListOperations
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице ответа.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListOperationsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/roles:
        get:
            tags:
                - RoleService
            description: Список доступных ролей пользователей кластера без пагинации.
            operationId: RoleService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListRolesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/topics:
        get:
            tags:
                - TopicService
            description: Список топиков.
            operationId: TopicService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    type: integer
                    format: int32
                - name: page_token
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    type: string
                - name: filter_by_partial_topic_name
                  in: query
                  description: Фильтр по полному или частичному имени топика.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListTopicsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - TopicService
            description: Создание топика.
            operationId: TopicService_Create
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.CreateTopicRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/topics/{name}:
        get:
            tags:
                - TopicService
            description: Получить топик.
            operationId: TopicService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Название топика.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.Topic'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - TopicService
            description: Удаление топика.
            operationId: TopicService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Название топика.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        patch:
            tags:
                - TopicService
            description: Изменение топика.
            operationId: TopicService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Название топика.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.UpdateTopicRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/users:
        get:
            tags:
                - UserService
            description: Список пользователей кластера без пагинации.
            operationId: UserService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListUsersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - UserService
            description: Создание пользователя.
            operationId: UserService_Create
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.CreateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/users/{name}:
        get:
            tags:
                - UserService
            description: Получение информации о пользователе.
            operationId: UserService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - UserService
            description: Удаление пользователя в кластере.
            operationId: UserService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        patch:
            tags:
                - UserService
            description: Изменение пользователя кластера.
            operationId: UserService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.UpdateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/operations/{operation_id}:
        get:
            tags:
                - OperationService
            description: Получение информации об операции по идентификатору.
            operationId: OperationService_Get
            parameters:
                - name: operation_id
                  in: path
                  description: Идентификатор операции.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/specifications:
        get:
            tags:
                - SpecificationService
            description: Получение списка спецификаций без пагинации.
            operationId: SpecificationService_List
            parameters:
                - name: version_id
                  in: query
                  description: Идентификатор версии продукта.
                  schema:
                    type: string
                - name: availability_zone_id
                  in: query
                  description: |-
                    Идентификатор зоны доступности.

                     Список зон доступности и их описание можно получить через API сервиса виртуальных машин
                     в разделе [Availability Zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Availability-Zones).
                  schema:
                    type: string
                - name: cluster_id
                  in: query
                  description: |-
                    Идентификатор кластера.
                     Укажите для получения спецификаций флейворов, доступных для вертикального масштабирования данного кластера.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListSpecificationsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/versions:
        get:
            tags:
                - VersionService
            description: Получение списка версий без пагинации.
            operationId: VersionService_List
            parameters:
                - name: product_type
                  in: query
                  description:  |
                    Название продукта. 
            
                    Укажите `kafka`. 
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.ListVersionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
components:
    schemas:
        cloudru.dbaas.kafka.v1.Cluster:
            required:
                - name
                - version_id
                - specification_id
                - brokers
                - storage_gib
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: name-of-cluster_1
                    type: string
                    description: Название кластера.
                description:
                    example: Some short text.
                    type: string
                    description: Описание кластера.
                version_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор версии кластера.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера.
                health:
                    readOnly: true
                    example: HEALTHY
                    enum:
                        - HEALTH_UNSPECIFIED
                        - HEALTHY
                        - UNHEALTHY
                    type: string
                    description: Состояние здоровья кластера.
                    format: enum
                status:
                    readOnly: true
                    example: READY
                    enum:
                        - STATUS_UNSPECIFIED
                        - PENDING
                        - DEPLOYING
                        - FAILED
                        - UPDATING
                        - READY
                        - SUSPENDED
                        - SUSPENDING
                        - ERASED
                        - ERASING
                        - ROLLING_BACK
                    type: string
                    description: Статус кластера.
                    format: enum
                created_at:
                    readOnly: true
                    example: 2026-02-14T17:17:45.000Z
                    type: string
                    description: Дата создания кластера.
                    format: date-time
                topic_partitions:
                    readOnly: true
                    example: 3
                    type: integer
                    description: Количество партиций.
                    format: int32
                brokers:
                    example: 3
                    type: integer
                    description: Количество брокеров в кластере.
                    format: int32
                in_sync_replicas:
                    readOnly: true
                    example: 2
                    type: integer
                    description: Количество реплик, синхронизированных с лидером.
                    format: int32
                kafka_hosts:
                    readOnly: true
                    example: ["kafka-node1.example.com:9092", "kafka-node2.example.com:9092"]
                    type: array
                    items:
                        type: string
                    description: Адреса кластера.
                kafka_ui_host:
                    readOnly: true
                    example: kafka-ui.example.com:8080
                    type: string
                    description: Адрес UI-интерфейса кластера.
                storage_gib:
                    example: 40
                    type: integer
                    description: Размер диска в гибибайтах.
                    format: int32
                logging:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.LoggingConfig'
                    description: Параметры интеграции с сервисом Клиентского логирования.
                parameters:
                    example: {"default.replication.factor": "2", "auto.create.topics.enable": "true"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Параметры кластера <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры кластера](https://cloud.ru/docs/paas-kafka/ug/topics/guides__parameters__available-parameters-list).
            description: Кластер Kafka.
        cloudru.dbaas.kafka.v1.CreateClusterRequest:
            required:
                - name
                - specification_id
                - version_id
                - subnet_id
                - project_id
                - storage_gib
                - brokers
                - ui_enabled
                - cruise_control_enabled
                - cruise_control_rebalance_auto_enabled
            type: object
            properties:
                name:
                    example: name-of-cluster_1
                    type: string
                    description: Название кластера.
                description:
                    example: Some short text.
                    type: string
                    description: Пользовательское описание кластера.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера.
                version_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор версии кластера.
                subnet_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор подсети.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                project_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                storage_gib:
                    example: 40
                    type: integer
                    description: Размер диска в гибибайтах.
                    format: int32
                brokers:
                    example: 3
                    type: integer
                    description: Количество брокеров.
                    format: int32
                ui_enabled:
                    example: false
                    type: boolean
                    description: Включен ли визуальный интерфейс кластера.
                cruise_control_enabled:
                    example: false
                    type: boolean
                    description: Укажите `true`, чтобы включить Cruise Control для управления кластером.
                cruise_control_rebalance_auto_enabled:
                    example: false
                    type: boolean
                    description: Укажите `true`, чтобы включить автоматическое перераспределение партиций в кластере.
                logging:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.kafka.v1.LoggingConfig'
                    description: Параметры интеграции с сервисом Клиентского логирования.
                parameters:
                    example: {"default.replication.factor": "2", "auto.create.topics.enable": "true"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Параметры кластера <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры кластера](https://cloud.ru/docs/paas-kafka/ug/topics/guides__parameters__available-parameters-list).
            description: Запрос на создание кластера.
