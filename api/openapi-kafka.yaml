                    type: string
                    description: Название версии продукта.
            description: Версия Kafka.
        cloudru.dbaas.operation.Operation:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор операции.
                resource_name:
                    readOnly: true
                    example: urn:cloud:postgresql::265c6f28-9c84-4cef-bbc5-4472c1743bc0:backend
                    type: string
                    description: Информация о ресурсе, над которым производится операция.
                    format: urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT
                resource_id:
                    readOnly: true
                    example: 54295782-7aef-43e6-b33b-c9735938677a
                    type: string
                    description: Уникальный идентификатор ресурса, над которым производится операция.
                created_at:
                    readOnly: true
                    type: string
                    description: Время создания операции.
                    format: date-time
                updated_at:
                    readOnly: true
                    type: string
                    description: Время последнего изменения операции.
                    format: date-time
                done:
                    readOnly: true
                    type: boolean
                    description: |-
                        Флаг завершенности операции:
                         - `true` — операция завершена. Операция считается завершенной, даже если в ходе ее выполнения возникла ошибка.
                         - `false` — операция не завершена.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
                    description: Результат операции в случае ошибки.
        cloudru.protobuf.v1.RepeatedString:
            type: object
            properties:
                value:
                    type: array
                    items:
                        type: string
                    description: The repeated string value.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: URL-адрес или имя ресурса, которое определяет тип сериализованного сообщения.
            additionalProperties: true
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: Код ошибки.
                    format: int32
                message:
                    type: string
                    description: Описание ошибки.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: Дополнительная информация об ошибке.
            description: Ошибка.
