                    additionalProperties:
                        type: string
                    description: |-
                        Параметры топика <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры топиков](https://cloud.ru/docs/paas-kafka/ug/topics/guides__topics-parameters).
            description: Запрос на изменение топика.
        cloudru.dbaas.kafka.v1.UpdateUserRequest:
            required:
                - cluster_id
                - name
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                password:
                    example: some_pass
                    type: string
                    description: Пароль.
                roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    deprecated: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
                         Используйте поле `granted_roles` вместо `roles`.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Запрос на изменение пользователя в кластере.
        cloudru.dbaas.kafka.v1.User:
            type: object
            properties:
                name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    deprecated: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
                         Используйте поле `granted_roles` вместо `roles`.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Пользователь Kafka.
        cloudru.dbaas.kafka.v1.Version:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
