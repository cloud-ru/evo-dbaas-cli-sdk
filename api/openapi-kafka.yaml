                    description: Идентификатор кластера.
                storage_gib:
                    example: 40
                    type: integer
                    description: Новый размер хранилища в гибибайтах.
                    format: int32
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации флейвора, назначаемый кластеру для вертикального скалирования.
                parameters:
                    example: {"default.replication.factor": "2", "auto.create.topics.enable": "true"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Параметры кластера <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры кластера](https://cloud.ru/docs/paas-kafka/ug/topics/guides__parameters__available-parameters-list).
            description: Запрос на изменение ресурсов кластера.
        cloudru.dbaas.kafka.v1.UpdateTopicRequest:
            required:
                - cluster_id
                - name
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: some_topic-1
                    type: string
                    description: Название топика.
                num_partitions:
                    example: 5
                    type: integer
                    description: Количество партиций.
                    format: int32
                replication_factor:
                    example: 1
                    type: integer
                    description: Фактор репликации.
                    format: int32
                parameters:
