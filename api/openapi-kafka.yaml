            description: Роль Kafka, которая дает пользователю права на выполнение операций с топиками.
        cloudru.dbaas.kafka.v1.Specification:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации.
                name:
                    readOnly: true
                    example: 4vCPU/16GB RAM (Business)
                    type: string
                    description: Название спецификации.
                cpu:
                    readOnly: true
                    example: 4
                    type: number
                    description: Количество виртуальных ядер процессора.
                    format: double
                memory:
                    readOnly: true
                    example: 16
                    type: number
                    description: Объем оперативной памяти в гигабайтах.
                    format: double
                flavor_type:
                    readOnly: true
                    example: BALANCE
                    deprecated: true
                    enum:
                        - FLAVOR_TYPE_UNSPECIFIED
                        - MEMORY
                        - CPU
                        - BALANCE
                    type: string
                    description: |-
                        Категория флейвора дата-узлов. Возможные значения:
                          - `cpu` — содержит флейворы с увеличенной долей ядер процессора. Соотношение vCPU к RAM 1:1 и 1:2.
                          - `balance` — содержит флейворы с оптимальным соотношением vCPU к RAM 1:4.
                          - `memory` — содержит флейворы с увеличенной долей оперативной памяти. Соотношение vCPU к RAM 1:8 и 1:16.

                         Deprecated: Поле будет удалено в будущем.
                    format: enum
                min_storage_gigs:
                    readOnly: true
                    example: 40
                    type: integer
                    description: Минимальный размер диска в гигабайтах.
                    format: int32
                min_brokers:
                    readOnly: true
                    example: 3
                    type: integer
                    description: Минимальное количество брокеров.
                    format: int32
                max_brokers:
                    readOnly: true
                    example: 11
                    type: integer
                    description: Максимальное количество брокеров.
                    format: int32
            description: Спецификация Kafka.
        cloudru.dbaas.kafka.v1.Topic:
            required:
                - name
                - num_partitions
                - replication_factor
                - parameters
            type: object
            properties:
                name:
                    example: some_topic-1
                    type: string
                    description: Название топика.
                num_partitions:
                    example: 5
                    type: integer
                    description: Количество партиций.
