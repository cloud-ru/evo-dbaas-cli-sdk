openapi: 3.0.3
info:
    title: Cloud.ru Managed Redis API
    description: '[Документация Managed Redis](https://cloud.ru/docs/redis/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: 1.0.0
servers:
    - url: https://redis.api.cloud.ru
paths:
    /v1/clusters:
        get:
            tags:
                - ClusterService
            description: Получение списка кластеров.
            operationId: ClusterService_List
            parameters:
                - name: project_id
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице ответа.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.ListClustersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - ClusterService
            description: Создание кластера.
            operationId: ClusterService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.redis.v1.CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}:
        get:
            tags:
                - ClusterService
            description: Получение информации о кластере.
            operationId: ClusterService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.Cluster'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - ClusterService
            description: Удаление кластера.
            operationId: ClusterService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        patch:
            tags:
                - ClusterService
            description: Изменение ресурсов кластера.
            operationId: ClusterService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.redis.v1.UpdateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/operations:
        get:
            tags:
                - ClusterService
            description: Получение списка операций, произведенных над кластером.
            operationId: ClusterService_ListOperations
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: page_size
                  in: query
                  description: Максимальное количество результатов на странице ответа.
                  schema:
                    type: string
                    format: int64
                - name: page_token
                  in: query
                  description: |-
                    Токен запрашиваемой страницы с результатами.
                     При первом запросе оставьте поле пустым.
                     При последующих запросах укажите значение параметра `next_page_token` из ответа метода.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.ListOperationsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/roles:
        get:
            tags:
                - RoleService
            description: Список ролей кластера.
            operationId: RoleService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.ListRolesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/users:
        get:
            tags:
                - UserService
            description: Список пользователей кластера.
            operationId: UserService_List
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.ListUsersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        post:
            tags:
                - UserService
            description: Создание пользователя.
            operationId: UserService_Create
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.redis.v1.CreateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/users/{name}:
        get:
            tags:
                - UserService
            description: Получение информации о пользователе.
            operationId: UserService_Get
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/clusters/{cluster_id}/users/{user_name}:
        put:
            tags:
                - UserService
            description: Изменение пользователя кластера.
            operationId: UserService_Update
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: user_name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.dbaas.redis.v1.UpdateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
        delete:
            tags:
                - UserService
            description: Удаление пользователя в кластере.
            operationId: UserService_Delete
            parameters:
                - name: cluster_id
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: user_name
                  in: path
                  description: Имя пользователя.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.DeleteUserResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/operations/{operation_id}:
        get:
            tags:
                - OperationService
            description: Получение информации об операции по идентификатору.
            operationId: OperationService_Get
            parameters:
                - name: operation_id
                  in: path
                  description: Идентификатор операции.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/specifications:
        get:
            tags:
                - SpecificationService
            description: Получение списка спецификаций без пагинации.
            operationId: SpecificationService_List
            parameters:
                - name: version_id
                  in: query
                  description: Идентификатор версии.
                  schema:
                    type: string
                - name: availability_zone_id
                  in: query
                  description: |-
                    Идентификатор зоны доступности.

                     Список зон доступности и их описание можно получить через API сервиса виртуальных машин
                     в разделе [Availability Zones](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Availability-Zones).
                  schema:
                    type: string
                - name: cluster_id
                  in: query
                  description: |-
                    Идентификатор кластера.
                     Укажите для получения спецификаций, доступных для вертикального масштабирования кластера.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.ListSpecificationsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
    /v1/versions:
        get:
            tags:
                - VersionService
            description: Получение списка версий без пагинации.
            operationId: VersionService_List
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.dbaas.redis.v1.ListVersionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/google.rpc.Status'
components:
    schemas:
        cloudru.dbaas.operation.Operation:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор операции.
                resource_name:
                    readOnly: true
                    example: urn:cloud:postgresql::265c6f28-9c84-4cef-bbc5-4472c1743bc0:backend
                    type: string
                    description: Информация о ресурсе, над которым производится операция.
                    format: urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT
                resource_id:
                    readOnly: true
                    example: 54295782-7aef-43e6-b33b-c9735938677a
                    type: string
                    description: Уникальный идентификатор ресурса, над которым производится операция.
                created_at:
                    readOnly: true
                    type: string
                    description: Время создания операции.
                    format: date-time
                updated_at:
                    readOnly: true
                    type: string
                    description: Время последнего изменения операции.
                    format: date-time
                done:
                    readOnly: true
                    type: boolean
                    description: |-
                        Флаг завершенности операции:
                         - `true` — операция завершена. Операция считается завершенной, даже если в ходе ее выполнения возникла ошибка.
                         - `false` — операция не завершена.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
                    description: Результат операции в случае ошибки.
        cloudru.dbaas.redis.v1.Cluster:
            required:
                - name
                - version_id
                - specification_id
                - type
                - shards
                - replicas
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: name-of-cluster_1
                    type: string
                    description: Название кластера.
                description:
                    readOnly: true
                    example: Some short text.
                    type: string
                    description: Описание кластера.
                version_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор версии.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера.
                health:
                    readOnly: true
                    example: HEALTHY
                    enum:
                        - HEALTH_UNSPECIFIED
                        - HEALTHY
                        - UNHEALTHY
                    type: string
                    description: Состояние здоровья.
                    format: enum
                status:
                    readOnly: true
                    example: READY
                    enum:
                        - STATUS_UNSPECIFIED
                        - PENDING
                        - DEPLOYING
                        - FAILED
                        - UPDATING
                        - READY
                        - SUSPENDED
                        - SUSPENDING
                        - ERASED
                        - ERASING
                        - ROLLING_BACK
                    type: string
                    description: Статус кластера.
                    format: enum
                type:
                    example: STANDALONE
                    enum:
                        - REDIS_CLUSTER_TYPE_UNSPECIFIED
                        - STANDALONE
                        - MASTER_REPLICA
                    type: string
                    description: Тип кластера.
                    format: enum
                created_at:
                    readOnly: true
                    example: 2026-02-14T17:17:45.000Z
                    type: string
                    description: Дата создания кластера.
                    format: date-time
                shards:
                    example: 3
                    type: integer
                    description: Количество шардов.
                    format: int32
                replicas:
                    example: 2
                    type: integer
                    description: Количество реплик.
                    format: int32
                redis_hosts:
                    readOnly: true
                    example: ["redis-node1.example.com:31926", "redis-node2.example.com:31926"]
                    type: array
                    items:
                        type: string
                    description: Адреса кластера.
                storage_size_gigs:
                    example: 15
                    deprecated: true
                    type: integer
                    description: |-
                        Размер диска в гигабайтах.
                         Используйте поле `storage_gib` вместо `storage_size_gigs`.
                    format: int32
                storage_gb:
                    example: 15
                    deprecated: true
                    type: integer
                    description: |-
                        Размер диска в гигабайтах.
                         Используйте поле `storage_gib` вместо `storage_gb`.
                    format: int32
                storage_gib:
                    example: 15
                    type: integer
                    description: Размер диска в гибибайтах.
                    format: int32
                logging:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.redis.v1.LoggingConfig'
                    description: Параметры интеграции с сервисом Клиентского логирования.
                zone_ids:
                    readOnly: true
                    example: ["00000000-0000-0000-0000-000000000000", "00000000-0000-0000-0000-000000000000"]
                    type: array
                    items:
                        type: string
                    description: Идентификаторы зон доступности кластера.
                subnet_ids:
                    example: ["00000000-0000-0000-0000-000000000000", "00000000-0000-0000-0000-000000000000"]
                    type: array
                    items:
                        type: string
                    description: Идентификаторы подсетей кластера.
                parameters:
                    example: {"appendonly": "false", "client-output-buffer-limit-normal|hard-limit": "1048576"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Параметры кластера <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры кластера](https://cloud.ru/docs/redis/ug/topics/guides__parameters__available-parameters-list).
            description: Кластер Redis.
        cloudru.dbaas.redis.v1.CreateClusterRequest:
            required:
                - name
                - specification_id
                - version_id
                - project_id
                - shards
                - replicas
                - type
            type: object
            properties:
                name:
                    example: name-of-cluster_1
                    type: string
                    description: Название кластера.
                description:
                    example: Some short text.
                    type: string
                    description: Пользовательское описание кластера.
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера.
                version_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор версии продукта.
                subnet_id:
                    example: 00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: |-
                        Идентификатор подсети.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                subnet_ids:
                    example: 00000000-0000-0000-0000-000000000000
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы подсетей.

                         Список подсетей и их описание можно получить через API сервиса виртуальных машин
                         в разделе [Subnets](https://cloud.ru/docs/virtual-machines/ug/topics/api-ref-v3#tag/Subnets).
                project_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                storage_size_gigs:
                    example: 15
                    deprecated: true
                    type: integer
                    description: |-
                        Размер диска в гигабайтах.
                         Используйте поле `storage_gib` вместо `storage_size_gigs`.
                    format: int32
                storage_gb:
                    example: 15
                    deprecated: true
                    type: integer
                    description: |-
                        Размер диска в гигабайтах.
                         Используйте поле `storage_gib` вместо `storage_gb`.
                    format: int32
                storage_gib:
                    example: 15
                    type: integer
                    description: Размер диска в гибибайтах.
                    format: int32
                shards:
                    example: 3
                    type: integer
                    description: Количество шардов.
                    format: int32
                replicas:
                    example: 2
                    type: integer
                    description: Количество реплик.
                    format: int32
                type:
                    example: STANDALONE
                    enum:
                        - REDIS_CLUSTER_TYPE_UNSPECIFIED
                        - STANDALONE
                        - MASTER_REPLICA
                    type: string
                    description: Тип кластера Redis.
                    format: enum
                logging:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.redis.v1.LoggingConfig'
                    description: Параметры интеграции с сервисом Клиентского логирования.
                parameters:
                    example: {"appendonly": "false", "client-output-buffer-limit-normal|hard-limit": "1048576"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Параметры кластера <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры кластера](https://cloud.ru/docs/redis/ug/topics/guides__parameters__available-parameters-list).
            description: Запрос на создание кластера.
        cloudru.dbaas.redis.v1.CreateUserRequest:
            required:
                - cluster_id
                - user_name
                - password
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                user_name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                password:
                    example: some_pass
                    type: string
                    description: Пароль.
                roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    deprecated: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Роли.
                         Используйте поле `granted_roles` вместо `roles`.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Запрос на создание пользователя в кластере.
        cloudru.dbaas.redis.v1.DeleteUserResponse:
            type: object
            properties: {}
            description: Ответ на запрос на удаление пользователя в кластере.
        cloudru.dbaas.redis.v1.ListClustersResponse:
            type: object
            properties:
                clusters:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.redis.v1.Cluster'
                    description: Список кластеров в текущем проекте.
                next_page_token:
                    example: abcdefghabcdefghabcdefghabcdefgh
                    type: string
                    description: Токен следующей страницы с результатами.
            description: Ответ на запрос на получение списка кластеров текущего проекта.
        cloudru.dbaas.redis.v1.ListOperationsResponse:
            type: object
            properties:
                operations:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.operation.Operation'
                    description: Список операций, выполненных над заданным кластером.
                next_page_token:
                    example: abcdefghabcdefghabcdefghabcdefgh
                    type: string
                    description: Токен следующей страницы с результатами.
            description: Ответ на запрос на получение списка операций кластера.
        cloudru.dbaas.redis.v1.ListRolesResponse:
            type: object
            properties:
                roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.redis.v1.Role'
                    description: Список ролей кластера.
            description: Ответ на запрос на получение списка ролей кластера.
        cloudru.dbaas.redis.v1.ListSpecificationsResponse:
            type: object
            properties:
                specifications:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.redis.v1.Specification'
                    description: Cписок спецификаций, доступных для определенной версии.
            description: Ответ на запрос на получение спецификаций.
        cloudru.dbaas.redis.v1.ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.redis.v1.User'
                    description: Список пользователей кластера.
            description: Ответ на запрос на получение списка пользователей кластера.
        cloudru.dbaas.redis.v1.ListVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.redis.v1.Version'
                    description: Список версий, доступных для продукта.
            description: Ответ на запрос на получение списка доступных версий продукта.
        cloudru.dbaas.redis.v1.LoggingConfig:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: |-
                        Признак отправки логов кластера.
                         По умолчанию `false` — логи не отправляются.
                log_group_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор лог-группы, в которую отправляются логи.
                         Если значение не задано, будет использоваться лог-группа проекта по умолчанию — `default`.
            description: Параметры интеграции с сервисом Клиентского логирования.
        cloudru.dbaas.redis.v1.Role:
            required:
                - name
            type: object
            properties:
                name:
                    example: cloud_writer
                    type: string
                    description: Название роли.
            description: Роль в Redis, представляющая набор привилегий, которую можно назначать пользователям.
        cloudru.dbaas.redis.v1.Specification:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации.
                name:
                    readOnly: true
                    example: 4vCPU/16GB RAM (Business)
                    type: string
                    description: Название спецификации.
                cpu:
                    readOnly: true
                    example: 4
                    type: number
                    description: Количество виртуальных ядер процессора.
                    format: double
                memory:
                    readOnly: true
                    example: 16
                    type: number
                    description: Объем оперативной памяти в гигабайтах.
                    format: double
                deployment_mode:
                    readOnly: true
                    example: BUSINESS
                    enum:
                        - DEPLOYMENT_MODE_UNSPECIFIED
                        - STANDARD
                        - BUSINESS
                    type: string
                    description: Режим развертывания кластера (Business или Standard).
                    format: enum
                flavor_type:
                    readOnly: true
                    example: BALANCE
                    deprecated: true
                    enum:
                        - FLAVOR_TYPE_UNSPECIFIED
                        - MEMORY
                        - CPU
                        - BALANCE
                    type: string
                    description: |-
                        Категория флейвора дата-узлов. Возможные значения:
                          - `cpu` — содержит флейворы с увеличенной долей ядер процессора. Соотношение vCPU к RAM 1:1 и 1:2.
                          - `balance` — содержит флейворы с оптимальным соотношением vCPU к RAM 1:4.
                          - `memory` — содержит флейворы с увеличенной долей оперативной памяти. Соотношение vCPU к RAM 1:8 и 1:16.

                         Deprecated: Поле будет удалено в будущем.
                    format: enum
                min_storage_gigs:
                    readOnly: true
                    example: 40
                    deprecated: true
                    type: integer
                    description: |-
                        Минимальный размер диска в гигабайтах.
                         Используйте поле `min_storage_gb` вместо `min_storage_gigs`. Поле будет удалено в будущем.
                    format: int32
                min_storage_gb:
                    readOnly: true
                    example: 40
                    type: integer
                    description: Минимальный размер диска в гигабайтах.
                    format: int32
            description: Спецификация Redis.
        cloudru.dbaas.redis.v1.UpdateClusterRequest:
            required:
                - cluster_id
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                storage_gb:
                    example: 15
                    deprecated: true
                    type: integer
                    description: |-
                        Размер диска в гигабайтах.
                         Используйте поле `storage_gib` вместо `storage_gb`.
                    format: int32
                storage_gib:
                    example: 15
                    type: integer
                    description: Размер диска в гибибайтах.
                    format: int32
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации, назначенной кластеру.
                parameters:
                    example: {"appendonly": "false", "client-output-buffer-limit-normal|hard-limit": "1048576"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Параметры кластера <параметр, значение>. Список поддерживаемых параметров и их описание доступны
                         в разделе документации [Параметры кластера](https://cloud.ru/docs/redis/ug/topics/guides__parameters__available-parameters-list).
            description: Запрос на изменение ресурсов кластера.
        cloudru.dbaas.redis.v1.UpdateUserRequest:
            required:
                - cluster_id
                - user_name
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                user_name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                password:
                    example: some_pass
                    type: string
                    description: Пароль.
                roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    deprecated: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Роли.
                         Используйте поле `granted_roles` вместо `roles`.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Запрос на изменение пользователя в кластере.
        cloudru.dbaas.redis.v1.User:
            required:
                - name
            type: object
            properties:
                name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                roles:
                    readOnly: true
                    example: ["cloud_writer", "cloud_reader"]
                    deprecated: true
                    type: array
                    items:
                        type: string
                    description: |-
                        Назначенные роли.
                         Используйте поле `granted_roles` вместо `roles`.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Пользователь базы данных Redis.
        cloudru.dbaas.redis.v1.Version:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор версии продукта.
                name:
                    readOnly: true
                    example: 7.2.11
                    type: string
                    description: Название версии продукта.
            description: Версия Redis.
        cloudru.protobuf.v1.RepeatedString:
            type: object
            properties:
                value:
                    type: array
                    items:
                        type: string
                    description: The repeated string value.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: URL-адрес или имя ресурса, которое определяет тип сериализованного сообщения.
            additionalProperties: true
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: Код ошибки.
                    format: int32
                message:
                    type: string
                    description: Описание ошибки.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: Дополнительная информация об ошибке.
            description: Ошибка.
tags:
    - name: ClusterService
      description: Управление кластерами Redis.
    - name: OperationService
      description: Управление операциями Redis.
    - name: RoleService
      description: Управление ролями Redis.
    - name: SpecificationService
      description: Управление спецификациями Redis.
    - name: UserService
      description: Управление пользователями Redis.
    - name: VersionService
      description: Управление версиями Redis.
