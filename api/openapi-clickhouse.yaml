                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Запрос на создание пользователя в кластере.
        cloudru.dbaas.clickhouse.v1.Database:
            required:
