                next_page_token:
                    readOnly: true
                    example: abcdefghabcdefghabcdefghabcdefgh
                    type: string
                    description: Токен следующей страницы с результатами.
            description: Ответ на запрос на получение списка кластеров текущего проекта.
        cloudru.dbaas.clickhouse.v1.ListDatabasesResponse:
            type: object
