        cloudru.dbaas.clickhouse.v1.Specification:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации.
                name:
                    readOnly: true
                    example: 8vCPU/32GB RAM (Business)
                    type: string
                    description: Название спецификации.
                cpu:
                    readOnly: true
                    example: 8
                    type: number
                    description: Количество виртуальных ядер процессора.
                    format: double
                memory:
                    readOnly: true
                    example: 32
                    type: number
                    description: Объем оперативной памяти в гигабайтах.
                    format: double
                flavor_type:
                    readOnly: true
                    example: FLAVOR_TYPE_BALANCE
                    deprecated: true
                    enum:
                        - FLAVOR_TYPE_UNSPECIFIED
                        - MEMORY
                        - CPU
                        - BALANCE
                    type: string
                    description: |-
                        Категория флейвора дата-узлов. Возможные значения:
                          - `cpu` — содержит флейворы с увеличенной долей ядер процессора. Соотношение vCPU к RAM 1:1 и 1:2.
                          - `balance` — содержит флейворы с оптимальным соотношением vCPU к RAM 1:4.
                          - `memory` — содержит флейворы с увеличенной долей оперативной памяти. Соотношение vCPU к RAM 1:8 и 1:16.

                         Deprecated: Поле будет удалено в будущем.
                    format: enum
                cluster_type:
                    readOnly: true
                    example: CLUSTER_TYPE_SINGLE_SHARD
                    enum:
                        - CLUSTER_TYPE_UNSPECIFIED
                        - SINGLE_NODE
                        - SINGLE_SHARD
                        - MULTI_SHARD
                    type: string
                    description: Тип кластера.
                    format: enum
                min_shards:
                    readOnly: true
                    example: 1
                    type: integer
                    description: Минимальное количество шардов.
                    format: int32
                max_shards:
                    readOnly: true
                    example: 1
                    type: integer
                    description: Максимальное количество шардов.
                    format: int32
                min_replicas:
                    readOnly: true
                    example: 3
                    type: integer
                    description: Минимальное количество реплик на шард.
                    format: int32
                max_replicas:
                    readOnly: true
                    example: 3
                    type: integer
                    description: Максимальное количество реплик на шард.
                    format: int32
                min_storage_gigs:
                    readOnly: true
                    example: 40
                    type: integer
                    description: Минимальный размер диска в гигабайтах.
                    format: int32
                role:
                    readOnly: true
                    example: SPECIFICATION_ROLE_CLICKHOUSE_SERVER
                    enum:
                        - SPECIFICATION_ROLE_UNSPECIFIED
                        - SPECIFICATION_ROLE_CLICKHOUSE_SERVER
                        - SPECIFICATION_ROLE_CLICKHOUSE_KEEPER
                    type: string
                    description: Назначение спецификации.
                    format: enum
            description: Спецификация ClickHouse.
