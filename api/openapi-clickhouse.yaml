    - name: RoleService
      description: Управление ролями ClickHouse.
    - name: SpecificationService
      description: Управление спецификациями ClickHouse.
    - name: UserService
      description: Управление пользователями ClickHouse.
    - name: VersionService
      description: Управление версиями ClickHouse.
