                    example: abcdefghabcdefghabcdefghabcdefgh
                    type: string
                    description: Токен следующей страницы с результатами.
            description: Ответ на запрос на получение списка операций кластера.
        cloudru.dbaas.clickhouse.v1.ListRolesResponse:
            type: object
