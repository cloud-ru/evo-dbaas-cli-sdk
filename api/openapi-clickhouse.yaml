                    description: |-
                        Идентификатор лог-группы, в которую отправляются логи.
                         Если значение не задано, будет использоваться лог-группа проекта по умолчанию — `default`.
            description: Параметры интеграции с сервисом Клиентского логирования.
        cloudru.dbaas.clickhouse.v1.RevokeRoleResponse:
