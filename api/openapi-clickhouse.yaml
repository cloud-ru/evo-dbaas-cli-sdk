                storage_gib:
                    example: 10
                    type: integer
                    description: Размер диска выделенного ClickHouse Keeper в гибибайтах.
                    format: int32
            description: Конфигурация выделенного ClickHouse Keeper.
        cloudru.dbaas.clickhouse.v1.UpdateClusterRequest:
            required:
                - cluster_id
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                config:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.clickhouse.v1.ClusterConfig'
                    description: Конфигурация кластера ClickHouse.
                storage_gib:
                    example: 40
                    type: integer
                    description: Новый размер хранилища в гибибайтах.
                    format: int32
                specification_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор спецификации кластера ClickHouse для вертикального масштабирования.
                standalone_keeper:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dbaas.clickhouse.v1.StandaloneKeeper'
                    description: Ресурсы выделенного ClickHouse Keeper.
            description: Запрос на изменение ресурсов кластера.
        cloudru.dbaas.clickhouse.v1.UpdateUserRequest:
            required:
                - cluster_id
                - user_name
            type: object
            properties:
                cluster_id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                user_name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                password:
                    example: some_pass
                    type: string
                    description: Пароль.
                roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    deprecated: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: |-
                        Роли.

                         Deprecated: используйте поле `granted_roles` вместо `roles`.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Запрос на изменение пользователя в кластере.
        cloudru.dbaas.clickhouse.v1.User:
            required:
                - name
            type: object
            properties:
                name:
                    example: some_user-1
                    type: string
                    description: Имя пользователя.
                roles:
                    readOnly: true
                    example: ["cloud_writer", "cloud_reader"]
                    deprecated: true
                    type: array
                    items:
                        type: string
                    description: |-
                        Назначенные роли.

                         Deprecated: используйте поле `granted_roles` вместо `roles`.
                read_only:
                    readOnly: true
                    example: false
                    type: boolean
                    description: |-
                        Доступ к пользователям:
                         - `true` — пользователи, которых нельзя редактировать. Это пользователи databaseAdmin и userAdmin.
                         - `false` — пользователи, которых можно редактировать. Это пользователи созданные через UI, public-api или terraform.
                granted_roles:
                    example: {"value": ["cloud_writer", "cloud_reader"]}
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.protobuf.v1.RepeatedString'
                    description: Список ролей, назначенных пользователю. Если список пуст, пользователь не может выполнять никакие действия.
            description: Пользователь базы данных ClickHouse.
        cloudru.dbaas.clickhouse.v1.Version:
            type: object
            properties:
                name:
                    readOnly: true
                    example: 24.3
                    type: string
                    description: Версия продукта.
            description: Версия ClickHouse.
        cloudru.dbaas.operation.Operation:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор операции.
                resource_name:
                    readOnly: true
                    example: urn:cloud:postgresql::265c6f28-9c84-4cef-bbc5-4472c1743bc0:backend
                    type: string
                    description: Информация о ресурсе, над которым производится операция.
                    format: urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT
                resource_id:
                    readOnly: true
                    example: 54295782-7aef-43e6-b33b-c9735938677a
                    type: string
                    description: Уникальный идентификатор ресурса, над которым производится операция.
                created_at:
                    readOnly: true
                    type: string
                    description: Время создания операции.
                    format: date-time
                updated_at:
                    readOnly: true
                    type: string
                    description: Время последнего изменения операции.
                    format: date-time
                done:
                    readOnly: true
                    type: boolean
                    description: |-
                        Флаг завершенности операции:
                         - `true` — операция завершена. Операция считается завершенной, даже если в ходе ее выполнения возникла ошибка.
                         - `false` — операция не завершена.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
                    description: Результат операции в случае ошибки.
        cloudru.protobuf.v1.RepeatedString:
            type: object
            properties:
                value:
                    type: array
                    items:
                        type: string
                    description: The repeated string value.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: URL-адрес или имя ресурса, которое определяет тип сериализованного сообщения.
            additionalProperties: true
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: Код ошибки.
                    format: int32
                message:
                    type: string
                    description: Описание ошибки.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: Дополнительная информация об ошибке.
            description: Ошибка.
