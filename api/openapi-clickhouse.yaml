                specifications:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.clickhouse.v1.Specification'
                    description: Список спецификаций, доступных для определенной версии.
            description: Ответ на запрос на получение спецификаций.
        cloudru.dbaas.clickhouse.v1.ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.clickhouse.v1.User'
                    description: Список пользователей кластера.
            description: Ответ на запрос на получение списка пользователей кластера.
        cloudru.dbaas.clickhouse.v1.ListVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.dbaas.clickhouse.v1.Version'
                    description: Список версий, доступных для продукта.
            description: Ответ на запрос на получение списка доступных версий продукта.
        cloudru.dbaas.clickhouse.v1.LoggingConfig:
            type: object
