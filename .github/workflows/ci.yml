name: ci
on:
  pull_request:
    # edited — правка описания PR («Рост строк: …») перезапускает храповик.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
# Гейту хватает чтения; запись есть только у release.yml.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # floorguard сравнивает с merge-base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Те же версии, что локально (task check).
      - name: tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      # floorguard — на PR; на push в main база — сам HEAD (пустой дифф): правку уже проверил PR,
      # а в снимке релиза дифф между релизами — не ход, опускающий планку.
      - name: task check
        # Описание PR — через env, не подстановкой в скрипт (инъекция).
        env:
          RATCHET_PR_BODY: ${{ github.event.pull_request.body }}
        run: task check BASE=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: task fuzz
        run: task fuzz
      - name: Upload failing fuzz corpus
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus
          path: '**/testdata/fuzz/**'
