name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
# два тега подряд не толкают формулу в main одновременно
concurrency: release
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Формула Homebrew — в Formula/ витрины, ставится через
      # brew tap cloud-ru/evo-dbaas-cli-sdk <url репо>. В основном репо шаг не идёт.
      - name: Формула Homebrew
        if: github.repository == 'cloud-ru/evo-dbaas-cli-sdk'
        run: |
          git fetch -q origin main
          git switch -q -C main origin/main
          mkdir -p Formula
          scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > Formula/cloudru-dbaas.rb
          git add Formula/cloudru-dbaas.rb
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Formula: cloudru-dbaas $GITHUB_REF_NAME"
          git pull -q --rebase origin main
          git push -q origin main
