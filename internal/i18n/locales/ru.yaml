redis.cluster.create.long: |-
  Создать кластер. Возвращает операцию; с --wait ждёт её завершения и печатает кластер.

  Порядок для нового кластера:
    cloudru-dbaas redis versions list                         # id версии
    cloudru-dbaas zones list                                  # availability_zone_id
    cloudru-dbaas redis specs list --version-id <VERSION_ID> --zone <ZONE>  # specification_id, минимальный диск
    cloudru-dbaas redis clusters create --name demo --version-id <VERSION_ID> --spec <SPEC_ID> \
        --type standalone --replicas 1 --storage-gib 15 --subnet-id <SUBNET_ID> --wait --timeout 60m

  --type standalone — один узел; master-replica — мастер и реплики. --replicas по умолчанию 1:
  без него API отвечает 400 «replicas must be positive» и для standalone (проверено 14.10).
