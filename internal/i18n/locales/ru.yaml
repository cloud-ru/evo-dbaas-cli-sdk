postgresql.cluster.create.flag.version: "версия PostgreSQL, см. versions list (обязательно)"
postgresql.cluster.create.long: |-
  Режим задаётся спецификацией: standard — 1–2 узла в одной подсети; business — 1–3 узла. Несколько подсетей создают мультизональный кластер, доступный только в режиме business; число подсетей должно совпадать с числом узлов. Ресурсы standard-кластера после создания не меняются.

  Бэкапы по умолчанию: если не задан ни один флаг --backup-*, CLI включает автоматическое резервное копирование с умолчаниями спеки — каждое воскресенье в 03:00 (0 3 * * SUN), срок хранения 14 дней; если задан только один флаг, второе поле берётся из этих умолчаний. API без блока backup создаёт кластер с выключенными бэкапами, поэтому CLI отправляет блок сам. Чтобы создать кластер без бэкапов, укажите --no-backup. --body с ключом backup заменяет блок целиком, флаги --backup-* и --no-backup тогда не действуют.
