cmd.long: |-
  cloudru-dbaas управляет кластерами Managed ClickHouse, Redis, Kafka и PostgreSQL в cloud.ru через Public API.

  Ключ доступа — из переменных окружения:
    CLOUDRU_KEY_ID, CLOUDRU_KEY_SECRET   ключ сервисного аккаунта или персональный ключ
    CLOUDRU_PROJECT_ID                   проект по умолчанию (или флаг --project)

  Для агентов: флаг --json выводит ответ API как есть, одной строкой JSON.

  Коды выхода: 0 успех, 1 ошибка (и операция в облаке упала), 2 отмена (Ctrl-C),
  4 ключ или доступ, 8 --wait не дождался — операция могла продолжиться.
cmd.short: "Managed ClickHouse, Redis, Kafka и PostgreSQL в cloud.ru из командной строки"
