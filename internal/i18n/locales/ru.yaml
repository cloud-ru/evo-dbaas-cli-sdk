redis.user.create.long: |-
  Создать пользователя. Пароль — через переменную окружения или первой строкой stdin:
    REDIS_PASSWORD=... cloudru-dbaas redis users create <CLUSTER_ID> app --password-env REDIS_PASSWORD --role <ROLE>
  Список ролей — cloudru-dbaas redis roles list <CLUSTER_ID>.
