clickhouse.user.create.long: |-
  Создать пользователя. Пароль лучше передавать через переменную окружения:
    CH_PASSWORD=... cloudru-dbaas clickhouse users create <CLUSTER_ID> app --password-env CH_PASSWORD --role cloud_writer
  или первой строкой stdin: --password-stdin. Флага с самим паролем нет: он виден
  в истории shell и в списке процессов.
  Без ролей пользователь ничего не может; список ролей — cloudru-dbaas clickhouse roles list <CLUSTER_ID>.
