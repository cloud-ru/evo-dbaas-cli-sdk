clickhouse.cluster.create.long: |-
  Создать кластер. Возвращает операцию; с --wait ждёт её завершения и печатает кластер.

  Порядок для нового кластера:
    cloudru-dbaas clickhouse versions list                                # версия
    cloudru-dbaas zones list                                              # availability_zone_id
    cloudru-dbaas clickhouse specs list --version 25.8 --zone <ZONE_ID>   # specification_id, min/max шардов и реплик
    cloudru-dbaas clickhouse clusters create --name demo --version 25.8 --spec <ID> \
        --shards 1 --replicas 1 --keeper embedded --storage-gib 40 \
        --subnet-id <SUBNET_ID> --wait --timeout 60m

  --replicas — реплик на шард: embedded — 1, standalone — 3.
  По умолчанию без --keeper: legacy поддерживает только 1×3 или 3×3 (шарды × реплики) с 1 подсетью.
  --keeper embedded требует 1 шард и 1 подсеть.
  --keeper standalone требует 1–3 шарда и 3 разные подсети в разных зонах,
  а также --keeper-spec (specs list --role keeper) и --keeper-storage-gib. Вживую не проверялся.
  --config ключ=число — серверные параметры (max_connections, max_concurrent_queries и др.,
  см. поле config в API); можно несколько раз.
  Создание минимального кластера — около 30 минут, после READY порт открывается ещё 2–3 мин.
