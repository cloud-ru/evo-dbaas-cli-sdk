kafka.cluster.create.long: |-
  Создать кластер. Возвращает операцию; с --wait ждёт её завершения и печатает кластер.

  Порядок для нового кластера:
    cloudru-dbaas kafka versions list                         # id версии
    cloudru-dbaas zones list                                  # availability_zone_id
    cloudru-dbaas kafka specs list --version-id <VERSION_ID> --zone <ZONE>  # specification_id, брокеры, минимальный диск
    cloudru-dbaas kafka clusters create --name demo --version-id <VERSION_ID> --spec <SPEC_ID> \
        --brokers 1 --storage-gib 40 --subnet-id <SUBNET_ID> --wait
