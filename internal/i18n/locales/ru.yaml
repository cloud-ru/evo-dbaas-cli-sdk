clickhouse.cluster.err.keeper_resources: "выделенный Keeper: нужна --keeper-spec (specs list --role keeper) и --keeper-storage-gib"
clickhouse.cluster.err.keeper_standalone: "--keeper-spec и --keeper-storage-gib — только с --keeper standalone"
