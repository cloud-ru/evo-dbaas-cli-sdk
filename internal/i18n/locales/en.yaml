redis.user.update.flag.role: "role; replaces the entire list; can be repeated"
redis.user.update.long: |-
  Change the password (--password-env or --password-stdin) and/or replace the role list
  entirely (--role, can be repeated).
  The Redis API replaces the entire user (PUT): without --role, the current roles
  are read and sent again.
