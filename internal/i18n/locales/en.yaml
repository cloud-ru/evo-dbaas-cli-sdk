clickhouse.cluster.create.long: |-
  Create a cluster. Returns an operation; --wait waits for completion and prints the cluster.

  Steps for a new cluster:
    cloudru-dbaas clickhouse versions list                                # version
    cloudru-dbaas zones list                                              # availability_zone_id
    cloudru-dbaas clickhouse specs list --version 25.8 --zone <ZONE_ID>   # specification_id, min/max shards and replicas
    cloudru-dbaas clickhouse clusters create --name demo --version 25.8 --spec <id> \
        --shards 1 --replicas 1 --keeper embedded --storage-gib 40 \
        --subnet-id <SUBNET_ID> --wait --timeout 60m

  --replicas means HOSTS per shard, 1–3 (verified on 9 October: replicas 1 means one host). The API
  specification calls them "additional" hosts — this is incorrect; 0 returns 400.
  --keeper embedded supports only 1×1 and one subnet (verified on 13 October); the default mode (legacy) accepts only 1×3 and 3×3 with one subnet;
  multi-AZ (multiple subnets) requires --keeper standalone.
  --keeper standalone means a dedicated Keeper: requires --keeper-spec (specs list --role keeper)
  and --keeper-storage-gib. Not verified live.
  --config key=number sets server settings (max_connections, max_concurrent_queries, etc.;
  see the config field in the API); can be repeated.
  Creating a minimal cluster takes about 30 minutes; the port opens 2–3 minutes after READY.
