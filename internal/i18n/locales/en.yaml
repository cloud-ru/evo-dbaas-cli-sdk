redis.cluster.create.long: |-
  Create a cluster. Returns an operation; with --wait, waits for completion and prints the cluster.

  Steps for a new cluster:
    cloudru-dbaas redis versions list                         # version id
    cloudru-dbaas zones list                                  # availability_zone_id
    cloudru-dbaas redis specs list --version-id <VERSION_ID> --zone <ZONE>  # specification_id, minimum disk size
    cloudru-dbaas redis clusters create --name demo --version-id <VERSION_ID> --spec <SPEC_ID> \
        --type standalone --replicas 1 --storage-gib 15 --subnet-id <SUBNET_ID> --wait --timeout 60m

  --type standalone means one node; master-replica means a primary and replicas. --replicas defaults to 1:
  without it, the API returns 400 "replicas must be positive" even for standalone (verified on 14 October).
