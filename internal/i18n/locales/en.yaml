redis.user.create.flag.role: "role; can be repeated"
redis.user.create.long: |-
  Create a user. Pass the password through an environment variable or the first line of stdin:
    REDIS_PASSWORD=... cloudru-dbaas redis users create <CLUSTER_ID> app --password-env REDIS_PASSWORD --role <ROLE>
  List roles with cloudru-dbaas redis roles list <CLUSTER_ID>.
