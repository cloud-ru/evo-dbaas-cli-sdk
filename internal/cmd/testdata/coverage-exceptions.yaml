# Сознательно не покрытое TestAPICoverage. Ключ — как в сообщении теста,
# значение — причина. Пустая причина — ошибка: молча пропущенного не бывает.
"query clickhouse GET /v1/clusters page_token": "отправляется со второй страницы; пагинацию проверяют TestClustersListPaginates и соседи"
"query clickhouse GET /v1/clusters/{cluster_id}/operations page_token": "то же, TestOperationsListPaginates"
"query redis GET /v1/clusters page_token": "то же, collectPages общий"
"query redis GET /v1/clusters/{cluster_id}/operations page_token": "то же, collectPages общий"
"query kafka GET /v1/clusters page_token": "то же, collectPages общий"
"query kafka GET /v1/clusters/{cluster_id}/operations page_token": "то же, TestKafkaOperationsListPaginates"
"query kafka GET /v1/clusters/{cluster_id}/topics page_token": "то же, collectPages общий"
"query clickhouse GET /v1/clusters page_size": "ClickHouse отдаёт список без page_size (проверено 9.10), страницы проходит collectPages"
"query clickhouse GET /v1/clusters/{cluster_id}/operations page_size": "то же"
"flag --wait": "ожидание операции проверяют TestClustersCreateWait, TestRedisCreateWait и соседи; здесь операции не завершаются"
"flag --timeout": "предел для --wait, см. --wait"
